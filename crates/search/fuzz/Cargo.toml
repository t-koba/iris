[package]
name = "iris-search-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
iris-search = { path = ".." }
libfuzzer-sys = "0.4"

[[bin]]
name = "segment_parse"
path = "fuzz_targets/segment_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ngram_normalize"
path = "fuzz_targets/ngram_normalize.rs"
test = false
doc = false
bench = false

[[bin]]
name = "filter_token_parse"
path = "fuzz_targets/filter_token_parse.rs"
test = false
doc = false
bench = false
