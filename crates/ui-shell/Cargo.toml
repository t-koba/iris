[package]
name = "iris-ui-shell"
version.workspace = true
edition = "2021"
default-run = "Iris"

[[bin]]
name = "Iris"
path = "src/main.rs"

[package.metadata.bundle]
name = "Iris"
identifier = "dev.tk.iris"
icon = [
    "../../assets/icons/iris-icon-32.png",
    "../../assets/icons/iris-icon-128.png",
    "../../assets/icons/iris-icon-256.png",
    "../../assets/icons/iris-icon-512.png",
    "../../assets/icons/iris-icon.ico",
    "../../assets/icons/iris-icon.icns",
]
category = "Productivity"
short_description = "Cross-platform file manager."
long_description = """
Iris is a cross-platform file manager shell for browsing, previewing, and
operating on local and remote files with a native GUI.
"""

[features]
default = ["video", "pdf", "raw-full"]
video = ["iris-thumb-preview/video"]
pdf = ["iris-thumb-preview/pdf"]
raw-full = ["iris-thumb-preview/raw-full"]
raw-core = ["iris-thumb-preview/raw-core"]
minimal = ["iris-thumb-preview/minimal"]

[dependencies]
iris-core-domain = { workspace = true }
iris-backends = { workspace = true }
iris-path-service = { workspace = true }
iris-subscription-manager = { workspace = true }
iris-remote-transport = { workspace = true }
iris-thumb-preview = { workspace = true, default-features = false }
iris-transfer = { workspace = true }
iris-catalog = { workspace = true }
iris-jobstore = { workspace = true }
iris-auth = { workspace = true }
iris-platform-integration = { workspace = true }
iris-search = { workspace = true }
iced = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
reqwest = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
dirs-next = "2"
open = { workspace = true }
image = { workspace = true }
mime_guess = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
fluent-bundle = "0.16"
unic-langid = "0.9"
sys-locale = "0.3"

[dev-dependencies]
async-trait = { workspace = true }
criterion = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }
iced_runtime = "0.14"
iced_tiny_skia = "0.14"

[[bench]]
name = "view_20k_entries"
harness = false

[[bench]]
name = "navigation_sort_100k"
harness = false

[build-dependencies]
embed-resource = "3.0.12"

[target.'cfg(not(target_os = "macos"))'.dependencies]
# macOS keeps the system allocator (see main.rs).
mimalloc = { version = "0.1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
