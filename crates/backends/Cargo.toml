[package]
name = "iris-backends"
version.workspace = true
edition = "2021"
description = "Storage backends for Iris: local file system, SMB, S3 and pCloud."
publish = false

[dependencies]
iris-core-domain = { workspace = true }
iris-platform-integration = { workspace = true }
iris-auth = { workspace = true }
iris-smb-client = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
reqwest = { workspace = true, features = ["multipart"] }
rustls = { workspace = true }
aws-sdk-s3 = { workspace = true }
aws-config = { workspace = true }
aws-smithy-http-client = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
mime_guess = { workspace = true }
ring = { workspace = true }
futures-util = { workspace = true }
bytes = { workspace = true }

[dev-dependencies]
iris-smb-client = { workspace = true, features = ["test-support"] }
criterion = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[[bench]]
name = "localfs_list"
harness = false

[target.'cfg(windows)'.dependencies]
winapi-util = "0.1.11"
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }
