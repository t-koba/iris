[package]
name = "iris-platform-integration"
version = "0.4.0"
edition = "2021"
description = "OS integration: mounts, trash, credentials, file watching and file times."
publish = false

[dependencies]
thiserror = { workspace = true }
tokio = { workspace = true }
trash = { workspace = true }
notify = { workspace = true }
open = { workspace = true }
keyring = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", features = ["NSError", "NSFileManager", "NSString", "NSURL"] }
