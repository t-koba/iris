name: Windows Media Foundation probe

# Test-only, unpackaged feasibility result for ONE pinned H.264 sample.
# No product builds, runtime staging, release changes or artifact retention.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  source-reader:
    runs-on: windows-2022
    timeout-minutes: ${{ fromJSON(vars.IRIS_MF_JOB_TIMEOUT_MINUTES || '10') }}
    env:
      IRIS_PREVIEW_CORPUS_MAX_BYTES: '40000000'
      IRIS_PREVIEW_CORPUS_TIMEOUT_SECONDS: ${{ vars.IRIS_PREVIEW_CORPUS_TIMEOUT_SECONDS || '60' }}
      IRIS_PREVIEW_CORPUS_RETRIES: ${{ vars.IRIS_PREVIEW_CORPUS_RETRIES || '4' }}
      IRIS_PREVIEW_CORPUS_RETRY_DELAY_SECONDS: ${{ vars.IRIS_PREVIEW_CORPUS_RETRY_DELAY_SECONDS || '2' }}
      IRIS_PREVIEW_CORPUS_MAX_RETRY_DELAY_SECONDS: ${{ vars.IRIS_PREVIEW_CORPUS_MAX_RETRY_DELAY_SECONDS || '30' }}
      IRIS_MF_MAX_DIMENSION: ${{ vars.IRIS_MF_MAX_DIMENSION || '2048' }}
      IRIS_MF_MAX_FRAME_BYTES: ${{ vars.IRIS_MF_MAX_FRAME_BYTES || '16777216' }}
      IRIS_MF_MAX_READS: ${{ vars.IRIS_MF_MAX_READS || '64' }}
      IRIS_MF_MAX_LOG_BYTES: ${{ vars.IRIS_MF_MAX_LOG_BYTES || '4096' }}
      IRIS_MF_BUILD_TIMEOUT_SECONDS: ${{ vars.IRIS_MF_BUILD_TIMEOUT_SECONDS || '120' }}
      IRIS_MF_FETCH_TIMEOUT_SECONDS: ${{ vars.IRIS_MF_FETCH_TIMEOUT_SECONDS || '300' }}
      IRIS_MF_DECODE_TIMEOUT_SECONDS: ${{ vars.IRIS_MF_DECODE_TIMEOUT_SECONDS || '30' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.x'
      - name: Set temporary probe root
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP ("iris-mf-{0}-{1}" -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT)
          "IRIS_MF_TEMP_ROOT=$root" >> $env:GITHUB_ENV
      - name: Check offline probe contracts
        shell: pwsh
        run: python prototype/windows-media-foundation/test-probe.py
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - name: Decode pinned MP4 with system Source Reader (JSON only)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path $env:IRIS_MF_TEMP_ROOT -ErrorAction Stop | Out-Null
          try {
            python prototype/windows-media-foundation/run.py
            $probeExit = $LASTEXITCODE
          } finally {
            Remove-Item -LiteralPath $env:IRIS_MF_TEMP_ROOT -Recurse -Force
          }
          exit $probeExit
      - name: Remove temporary bytes even after an interrupted probe
        if: always()
        shell: pwsh
        run: |
          $root = $env:IRIS_MF_TEMP_ROOT
          if (![string]::IsNullOrWhiteSpace($root) -and (Test-Path -LiteralPath $root)) {
            Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction Stop
          }
