name: Windows FFmpeg native validation

# Reusable, report-only Windows default-preview validation. The registered CI
# workflow calls this only on manual dispatch at the caller's exact SHA. It
# acquires the signature-verified FFmpeg source, derives a local-source vcpkg
# overlay, builds the release binaries, stages one isolated Iris runtime,
# inventories the staged PE import closure and smoke-tests that staged runtime
# with a system-only PATH. It never promotes a release, changes the minimal
# packaging variant, or retains native bytes.
on:
  workflow_call:

permissions:
  contents: read
  attestations: read

jobs:
  validate:
    runs-on: windows-2022
    env:
      CARGO_TERM_COLOR: always
      IRIS_VALIDATION_VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-validation
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-validation
      VCPKG_INSTALLED_DIR: ${{ github.workspace }}/.vcpkg-validation/installed
      VCPKG_TARGET_TRIPLET: x64-windows-iris-dynamic
      VCPKG_DEFAULT_TRIPLET: x64-windows-iris-dynamic
      VCPKGRS_TRIPLET: x64-windows-iris-dynamic
      VCPKGRS_DYNAMIC: "1"
      IRIS_VALIDATION_TRIPLET: x64-windows-iris-dynamic
      IRIS_VALIDATION_SOURCE: ${{ github.workspace }}/build/validation/ffmpeg-src
      IRIS_VALIDATION_OVERLAY: ${{ github.workspace }}/build/validation/overlay
      IRIS_VALIDATION_EVIDENCE: ${{ github.workspace }}/build/validation/evidence
      IRIS_PREVIEW_LATENCY_WARMUPS: "2"
      IRIS_PREVIEW_LATENCY_SAMPLES: "21"
      IRIS_PREVIEW_CORPUS_MAX_BYTES: "40000000"
      IRIS_PREVIEW_CORPUS_TIMEOUT_SECONDS: "60"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # Offline fail-closed gates run before any native work.
      - name: Windows FFmpeg provenance contract
        shell: bash
        run: python3 scripts/test-windows-ffmpeg-provenance.py
      - name: Windows FFmpeg source acquisition contract
        shell: bash
        run: python3 scripts/test-windows-ffmpeg-source.py
      - name: Windows FFmpeg overlay derivation contract
        shell: bash
        run: python3 scripts/test-windows-ffmpeg-overlay.py
      - name: Windows FFmpeg validation input gate
        shell: bash
        run: python3 scripts/windows-ffmpeg-validation-config.py build/validation/evidence/validation-inputs.json
      - name: Windows FFmpeg validation config contract
        shell: bash
        run: python3 scripts/test-windows-ffmpeg-validation-config.py
      - name: Windows FFmpeg validation workflow contract
        shell: bash
        run: python3 scripts/test-windows-ffmpeg-validation-workflow.py

      # Pinned vcpkg source checkout; fail closed on HEAD drift before building.
      - name: Checkout pinned vcpkg source
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: b8dfe957ec8b5c0ef5c4b31eea594b8486af744f
          path: .vcpkg-validation
          fetch-depth: 0
          persist-credentials: false

      - name: Assert pinned vcpkg HEAD and baseline port
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vcpkgRoot = $env:IRIS_VALIDATION_VCPKG_ROOT
          $head = ((git -C $vcpkgRoot rev-parse HEAD) | Out-String).Trim()
          Write-Host "vcpkg HEAD: $head"
          if ($head -ne "b8dfe957ec8b5c0ef5c4b31eea594b8486af744f") {
            throw "vcpkg HEAD $head != pinned baseline; refusing to build"
          }
          git -C $vcpkgRoot diff --exit-code $head -- ports/ffmpeg scripts/cmake/vcpkg_from_github.cmake
          if ($LASTEXITCODE -ne 0) { throw "baseline FFmpeg port/helper has local changes" }

      - name: Bootstrap pinned vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = $env:IRIS_VALIDATION_VCPKG_ROOT
          & (Join-Path $root "bootstrap-vcpkg.bat")
          if ($LASTEXITCODE -ne 0) { throw "vcpkg bootstrap failed" }
          & (Join-Path $root "vcpkg.exe") --version
          if ($LASTEXITCODE -ne 0) { throw "vcpkg --version failed" }

      - name: Set up MSVC developer environment (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Restore isolated vcpkg root after MSVC setup
        shell: pwsh
        run: |
          "VCPKG_ROOT=$env:IRIS_VALIDATION_VCPKG_ROOT" >> $env:GITHUB_ENV

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      # Acquire the signature-verified 8.1.3 source and stage it locally.
      - name: Acquire and stage verified FFmpeg source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pin = python3 scripts/windows-ffmpeg-source.py plan | ConvertFrom-Json
          if ($pin.version -ne "8.1.3") { throw "unapproved FFmpeg version" }
          $dest = $env:IRIS_VALIDATION_SOURCE
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          # GnuPG reads a drive-qualified path as a key resource URL on
          # Windows, so every path it sees is workspace-relative.
          $gpgDir = "build/validation/gpg"
          New-Item -ItemType Directory -Force -Path $gpgDir | Out-Null
          $archive = Join-Path $env:RUNNER_TEMP "ffmpeg-8.1.3.tar.xz"
          $asc = Join-Path $env:RUNNER_TEMP "ffmpeg-8.1.3.tar.xz.asc"
          $gpgArchive = "$gpgDir/ffmpeg-8.1.3.tar.xz"
          $gpgAsc = "$gpgDir/ffmpeg-8.1.3.tar.xz.asc"
          $key = "$gpgDir/ffmpeg-key.asc"
          $gpgHome = "$gpgDir/home"
          New-Item -ItemType Directory -Force -Path $gpgHome | Out-Null
          Invoke-WebRequest -Uri $pin.url -OutFile $archive -UseBasicParsing
          Invoke-WebRequest -Uri $pin.signature_url -OutFile $asc -UseBasicParsing
          Invoke-WebRequest -Uri $pin.key_url -OutFile $key -UseBasicParsing
          Copy-Item -LiteralPath $archive -Destination $gpgArchive -Force
          Copy-Item -LiteralPath $asc -Destination $gpgAsc -Force
          # gpg produces a machine-readable status file consumed by the shared verifier.
          $status = "$gpgDir/status.txt"
          & gpg --homedir $gpgHome --batch --import $key
          if ($LASTEXITCODE -ne 0) { throw "FFmpeg signing key import failed" }
          & gpg --homedir $gpgHome --batch --status-file $status --verify $gpgAsc $gpgArchive
          if ($LASTEXITCODE -ne 0) { throw "FFmpeg signature verification failed" }
          python3 scripts/windows-ffmpeg-source.py stage $archive $status $dest
          if ($LASTEXITCODE -ne 0) { throw "FFmpeg source staging failed" }

      # Derive an overlay portfile that points vcpkg at the verified local source.
      - name: Derive local-source vcpkg overlay
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # The verified tarball extracts under ffmpeg-<version>/; the vcpkg
          # SOURCE_PATH must be that directory, not the staging root.
          $sourceDir = Join-Path $env:IRIS_VALIDATION_SOURCE "ffmpeg-8.1.3"
          if (!(Test-Path -LiteralPath (Join-Path $sourceDir "configure") -PathType Leaf)) { throw "staged FFmpeg source missing configure; layout drifted" }
          if (!(Test-Path -LiteralPath (Join-Path $sourceDir "RELEASE") -PathType Leaf)) { throw "staged FFmpeg source missing RELEASE; layout drifted" }
          $overlay = $env:IRIS_VALIDATION_OVERLAY
          $portDir = Join-Path $overlay "ffmpeg"
          if (Test-Path -LiteralPath $portDir) { Remove-Item -Recurse -Force -LiteralPath $portDir }
          New-Item -ItemType Directory -Force -Path $portDir | Out-Null
          # vcpkg overlay ports are port-named subdirectories; seed the baseline
          # port (patches, vcpkg.json, usage) then replace only its portfile.
          Copy-Item -Recurse -Force -Path (Join-Path $env:IRIS_VALIDATION_VCPKG_ROOT "ports/ffmpeg/*") -Destination $portDir
          $portfile = Join-Path $env:IRIS_VALIDATION_VCPKG_ROOT "ports/ffmpeg/portfile.cmake"
          python3 scripts/windows-ffmpeg-overlay.py derive $portfile $sourceDir (Join-Path $portDir "portfile.cmake")
          if ($LASTEXITCODE -ne 0) { throw "overlay derivation failed" }

      - name: Install FFmpeg via pinned vcpkg with verified overlay
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $manifestRoot = Join-Path $env:GITHUB_WORKSPACE "packaging/windows/validation"
          $installRoot = Join-Path $env:IRIS_VALIDATION_VCPKG_ROOT "installed"
          $tripletDir = Join-Path $env:GITHUB_WORKSPACE "packaging/windows/validation/triplets"
          if (@($manifestRoot, $installRoot, $tripletDir, $env:IRIS_VALIDATION_OVERLAY).Where({ [string]::IsNullOrWhiteSpace($_) }).Count -gt 0) { throw "empty vcpkg path" }
          Write-Host "manifest root: $manifestRoot"
          Write-Host "install root: $installRoot"
          Write-Host "overlay triplets: $tripletDir"
          $env:VCPKG_OVERLAY_PORTS = $env:IRIS_VALIDATION_OVERLAY
          $env:VCPKG_OVERLAY_TRIPLETS = $tripletDir
          & (Join-Path $env:IRIS_VALIDATION_VCPKG_ROOT "vcpkg.exe") install `
            "--x-manifest-root=$manifestRoot" `
            "--x-install-root=$installRoot" `
            --triplet=x64-windows-iris-dynamic
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed" }
          # Rust does not copy vcpkg DLLs beside the binary. The DLLs are copied
          # into one isolated runtime stage below; the install tree is never
          # placed on PATH, so no later smoke run can load FFmpeg from it.
          $binDir = Join-Path $env:VCPKG_INSTALLED_DIR "x64-windows-iris-dynamic/bin"
          if (!(Test-Path -LiteralPath $binDir)) { throw "vcpkg FFmpeg DLL bin dir missing: $binDir" }
          $dlls = @(Get-ChildItem -LiteralPath $binDir -Filter "*.dll" -File)
          if ($dlls.Count -lt 2) { throw "FFmpeg DLL closure missing in $binDir" }
          $dlls | ForEach-Object { Write-Host "FFmpeg DLL: $($_.Name)" }

      - name: Build product with stock locked bindings
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Git bash puts its own link.exe ahead of MSVC's, so build from pwsh
          # where the MSVC developer PATH from the previous step is authoritative.
          cargo build --release -p iris-ui-shell --locked
          if ($LASTEXITCODE -ne 0) { throw "release product build failed" }
          cargo build --release -p iris-thumb-preview --example preview_corpus_smoke --locked
          if ($LASTEXITCODE -ne 0) { throw "release preview example build failed" }
          foreach ($relative in @("target/release/Iris.exe", "target/release/examples/preview_corpus_smoke.exe")) {
            if (!(Test-Path -LiteralPath (Join-Path $env:GITHUB_WORKSPACE $relative) -PathType Leaf)) { throw "release binary missing: $relative" }
          }

      - name: Stage attested PDFium runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $pin = python3 scripts/windows-ffmpeg-source.py pdfium | ConvertFrom-Json
          if ($pin.release -ne "chromium/8138") { throw "unapproved PDFium release" }
          if ($pin.attestation_required -ne $true) { throw "PDFium attestation not required" }
          $asset = Join-Path $env:RUNNER_TEMP $pin.asset
          Invoke-WebRequest -Uri $pin.url -OutFile "$asset.part" -UseBasicParsing
          if ((Get-Item -LiteralPath "$asset.part").Length -ne $pin.bytes) { throw "PDFium size mismatch" }
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath "$asset.part").Hash.ToLowerInvariant() -ne $pin.sha256) { throw "PDFium sha256 mismatch" }
          Move-Item -Force -LiteralPath "$asset.part" -Destination $asset
          # Bind the exact asset to the pinned GitHub release attestation before
          # any native bytes are listed or extracted. The bundle pin is shared
          # with the Linux PDFium contract (scripts/fetch-pdfium-runtime.sh).
          if ($pin.attestation_asset -ne "pdfium-attestation.json") { throw "unapproved PDFium attestation bundle" }
          if ($pin.attestation_bytes -ne 18267) { throw "unapproved PDFium attestation bundle size" }
          if ($pin.attestation_sha256 -ne "7526f4b934ab498d6206ac7f3d78dd4ce8e0f7d3175227ab3f4ecc255d950ad7") { throw "unapproved PDFium attestation bundle sha256" }
          $bundle = Join-Path $env:RUNNER_TEMP $pin.attestation_asset
          $bundleUrl = "https://github.com/$($pin.repo)/releases/download/$($pin.release)/$($pin.attestation_asset)"
          Invoke-WebRequest -Uri $bundleUrl -OutFile "$bundle.part" -UseBasicParsing
          if ((Get-Item -LiteralPath "$bundle.part").Length -ne $pin.attestation_bytes) { throw "PDFium attestation bundle size mismatch" }
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath "$bundle.part").Hash.ToLowerInvariant() -ne $pin.attestation_sha256) { throw "PDFium attestation bundle sha256 mismatch" }
          Move-Item -Force -LiteralPath "$bundle.part" -Destination $bundle
          gh attestation verify $asset --repo $pin.repo --bundle $bundle --signer-workflow $pin.signer_workflow --signer-digest $pin.signer_digest --source-digest $pin.source_digest --source-ref $pin.source_ref
          if ($LASTEXITCODE -ne 0) { throw "PDFium release attestation verification failed" }
          # Validate the complete member + licensing closure before extraction.
          $members = @(tar -tzf $asset | ForEach-Object { $_.Trim() } | Where-Object { $_ } | Sort-Object -Unique)
          if ($LASTEXITCODE -ne 0 -or $members.Count -eq 0) { throw "PDFium member listing failed" }
          foreach ($m in $members) {
            if ($m.StartsWith("/") -or $m -match "(^|/)\.\.(/|$)") { throw "unsafe PDFium member '$m'" }
          }
          $dllMembers = @($members | Where-Object { $_ -eq "bin/pdfium.dll" -or $_ -eq "pdfium.dll" })
          if ($dllMembers.Count -eq 0) { throw "PDFium DLL member absent" }
          foreach ($required in @("LICENSE", "VERSION", "args.gn", "licenses/")) {
            if (!@($members | Where-Object { $_ -match $required }).Count) { throw "PDFium closure member missing: $required" }
          }
          $extract = Join-Path $env:RUNNER_TEMP "pdfium-extract"
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          tar -xzf $asset -C $extract
          if ($LASTEXITCODE -ne 0) { throw "PDFium extraction failed" }
          $runtime = Join-Path $env:RUNNER_TEMP "pdfium-runtime"
          New-Item -ItemType Directory -Force -Path $runtime | Out-Null
          foreach ($m in $dllMembers) {
            Copy-Item -LiteralPath (Join-Path $extract ($m -replace "/", [IO.Path]::DirectorySeparatorChar)) -Destination (Join-Path $runtime "pdfium.dll") -Force
          }
          if (!(Test-Path -LiteralPath (Join-Path $runtime "pdfium.dll") -PathType Leaf)) { throw "attested PDFium DLL missing" }
          "IRIS_VALIDATION_PDFIUM_RUNTIME=$runtime" >> $env:GITHUB_ENV
          Write-Host "verified and staged $($pin.asset): $($pin.bytes) bytes"

      - name: Stage one isolated Iris runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = Join-Path $env:RUNNER_TEMP "iris-runtime-stage"
          if (Test-Path -LiteralPath $stage) { Remove-Item -Recurse -Force -LiteralPath $stage }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $dllDir = Join-Path $env:VCPKG_INSTALLED_DIR "$env:IRIS_VALIDATION_TRIPLET/bin"
          if (!(Test-Path -LiteralPath $dllDir -PathType Container)) { throw "vcpkg DLL directory missing: $dllDir" }
          if ([string]::IsNullOrWhiteSpace($env:IRIS_VALIDATION_PDFIUM_RUNTIME)) { throw "attested PDFium runtime not bound" }
          $pdfium = Join-Path $env:IRIS_VALIDATION_PDFIUM_RUNTIME "pdfium.dll"
          if (!(Test-Path -LiteralPath $pdfium -PathType Leaf)) { throw "attested PDFium DLL missing: $pdfium" }
          foreach ($relative in @("target/release/Iris.exe", "target/release/examples/preview_corpus_smoke.exe")) {
            $source = Join-Path $env:GITHUB_WORKSPACE $relative
            if (!(Test-Path -LiteralPath $source -PathType Leaf)) { throw "release binary missing: $relative" }
            Copy-Item -LiteralPath $source -Destination (Join-Path $stage (Split-Path $source -Leaf)) -Force
          }
          $dlls = @(Get-ChildItem -LiteralPath $dllDir -Filter "*.dll" -File)
          if ($dlls.Count -lt 2) { throw "vcpkg DLL closure missing in $dllDir" }
          foreach ($dll in $dlls) { Copy-Item -LiteralPath $dll.FullName -Destination (Join-Path $stage $dll.Name) -Force }
          Copy-Item -LiteralPath $pdfium -Destination (Join-Path $stage "pdfium.dll") -Force
          # The example's own identity probe calls `rustc --version`; stage the
          # real compiler and its DLLs too, so the smoke needs no toolchain on
          # PATH. The sysroot is read before PATH is narrowed for the smoke.
          $sysroot = (& rustc --print sysroot | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($sysroot)) { throw "rustc sysroot probe failed" }
          $rustcBin = Join-Path $sysroot "bin"
          $rustcExe = Join-Path $rustcBin "rustc.exe"
          if (!(Test-Path -LiteralPath $rustcExe -PathType Leaf)) { throw "rustc executable missing: $rustcExe" }
          Copy-Item -LiteralPath $rustcExe -Destination (Join-Path $stage "rustc.exe") -Force
          foreach ($dll in @(Get-ChildItem -LiteralPath $rustcBin -Filter "*.dll" -File)) {
            Copy-Item -LiteralPath $dll.FullName -Destination (Join-Path $stage $dll.Name) -Force
          }
          $staged = @(Get-ChildItem -LiteralPath $stage -File)
          if ($staged.Count -lt ($dlls.Count + 4)) { throw "staged runtime incomplete" }
          $evidenceDir = $env:IRIS_VALIDATION_EVIDENCE
          if ([string]::IsNullOrWhiteSpace($evidenceDir)) { throw "evidence directory not bound" }
          New-Item -ItemType Directory -Force -Path $evidenceDir | Out-Null
          # Only shippable files are inventoried: the preview helper, the
          # compiler and its DLLs stay in the runtime stage for the smoke only.
          $productNames = @("Iris.exe") + @($dlls | ForEach-Object { $_.Name }) + @("pdfium.dll")
          $productNames = @($productNames | Sort-Object -Unique)
          if ($productNames.Count -lt 3) { throw "product inventory empty" }
          foreach ($helper in @("rustc.exe", "preview_corpus_smoke.exe")) {
            if ($productNames -contains $helper) { throw "preview helper in product inventory: $helper" }
          }
          foreach ($required in @("Iris.exe", "pdfium.dll")) {
            if (!(Test-Path -LiteralPath (Join-Path $stage $required) -PathType Leaf)) { throw "required product file missing: $required" }
          }
          $productFiles = @()
          foreach ($name in $productNames) {
            $copy = Join-Path $stage $name
            if (!(Test-Path -LiteralPath $copy -PathType Leaf)) { throw "shippable product file missing: $name" }
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $copy).Hash.ToLowerInvariant()
            $bytes = (Get-Item -LiteralPath $copy).Length
            if ($bytes -le 0) { throw "shippable product file empty: $name" }
            $productFiles += @{ name = $name; sha256 = $hash; bytes = $bytes }
          }
          if ($productFiles.Count -eq 0) { throw "product inventory empty" }
          $inventory = @{ roots = @($stage); files = @($productFiles) }
          Set-Content -LiteralPath (Join-Path $evidenceDir "product-inventory.json") -Value ($inventory | ConvertTo-Json -Depth 5 -Compress) -Encoding utf8
          "IRIS_VALIDATION_STAGE=$stage" >> $env:GITHUB_ENV
          Write-Host "staged Iris runtime: $stage"

      - name: Inventory staged PE import closure
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:IRIS_VALIDATION_STAGE)) { throw "runtime stage not bound" }
          $stage = $env:IRIS_VALIDATION_STAGE
          if (!(Test-Path -LiteralPath $stage -PathType Container)) { throw "runtime stage missing: $stage" }
          # Windows-provided DLLs are the only imports allowed to resolve
          # outside the stage. API sets and extension DLLs are virtual
          # forwarders with no on-disk file; every other system DLL must
          # physically exist in a Windows system directory. Anything else must
          # resolve to a file in the stage and is then inventoried in turn.
          # This is fail-closed: a missing non-system DLL is found neither in a
          # system directory nor in the stage, so it fails.
          $systemDirs = @(
            (Join-Path $env:SystemRoot "System32"),
            (Join-Path $env:SystemRoot "SysWOW64"),
            $env:SystemRoot
          )
          $roots = @(
            (Join-Path $env:IRIS_VALIDATION_STAGE "Iris.exe"),
            (Join-Path $env:IRIS_VALIDATION_STAGE "preview_corpus_smoke.exe"),
            (Join-Path $env:IRIS_VALIDATION_STAGE "rustc.exe"),
            (Join-Path $env:IRIS_VALIDATION_STAGE "pdfium.dll")
          )
          $rootNames = @($roots | ForEach-Object { [IO.Path]::GetFileName($_) })
          $queue = New-Object System.Collections.Generic.Queue[string]
          foreach ($root in $roots) {
            if (!(Test-Path -LiteralPath $root -PathType Leaf)) { throw "staged binary missing: $root" }
            $queue.Enqueue($root)
          }
          $visited = @{}
          $imports = @()
          $unresolved = @()
          while ($queue.Count -gt 0) {
            $binary = $queue.Dequeue()
            $name = [IO.Path]::GetFileName($binary)
            $key = $name.ToLowerInvariant()
            if ($visited.ContainsKey($key)) { continue }
            if ($visited.Count -ge 256) { throw "PE import closure exceeds binary bound" }
            $visited[$key] = $true
            $output = (& dumpbin /DEPENDENTS $binary | Out-String)
            if ($LASTEXITCODE -ne 0) { throw "dumpbin /DEPENDENTS failed for $name" }
            $importMatches = [regex]::Matches($output, '(?im)^\s{2,}([A-Za-z0-9_.-]{1,128}\.dll)\s*$')
            foreach ($m in $importMatches) {
              $import = $m.Groups[1].Value.ToLowerInvariant()
              if ($imports.Count -ge 4096) { throw "PE import evidence exceeds bound" }
              $isSystem = $import.StartsWith("api-ms-win-") -or $import.StartsWith("ext-ms-win-")
              if (!$isSystem) {
                foreach ($sysDir in $systemDirs) {
                  if (Test-Path -LiteralPath (Join-Path $sysDir $import) -PathType Leaf) { $isSystem = $true; break }
                }
              }
              $resolution = "stage"
              if ($isSystem) {
                $resolution = "system"
              } else {
                $candidate = Join-Path $stage $import
                if (!(Test-Path -LiteralPath $candidate -PathType Leaf)) {
                  $resolution = "unresolved"
                  $unresolved += "$name -> $import"
                } else {
                  $queue.Enqueue($candidate)
                }
              }
              $imports += @{ from = $name; import = $import; resolution = $resolution }
            }
          }
          if ($imports.Count -eq 0) { throw "no PE imports parsed; dumpbin output shape drifted" }
          if (!$visited.ContainsKey("pdfium.dll")) { throw "staged pdfium.dll missing from PE inventory" }
          $evidenceDir = $env:IRIS_VALIDATION_EVIDENCE
          New-Item -ItemType Directory -Force -Path $evidenceDir | Out-Null
          $closure = @{
            roots = @($rootNames)
            binaries = @($visited.Keys | Sort-Object)
            imports = @($imports)
            unresolved = @($unresolved)
          }
          Set-Content -LiteralPath (Join-Path $evidenceDir "pe-import-closure.json") -Value ($closure | ConvertTo-Json -Depth 6 -Compress) -Encoding utf8
          if ($unresolved.Count -gt 0) { throw ("unresolved staged PE imports: " + ($unresolved -join ", ")) }

      - name: Staged preview smoke (video, PDF, RAW)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Fetch with the runner PATH, then run only the staged binary with a
          # PATH of system directories plus the one stage directory. No build,
          # vcpkg or PDFium directory can satisfy this smoke run.
          $corpus = Join-Path $env:RUNNER_TEMP "iris-preview-corpus"
          python3 scripts/fetch-preview-corpus.py --output $corpus
          if ($LASTEXITCODE -ne 0) { throw "preview corpus fetch failed" }
          if ([string]::IsNullOrWhiteSpace($env:IRIS_VALIDATION_STAGE)) { throw "runtime stage not bound" }
          $stage = $env:IRIS_VALIDATION_STAGE
          $smokeExe = Join-Path $env:IRIS_VALIDATION_STAGE "preview_corpus_smoke.exe"
          if (!(Test-Path -LiteralPath $smokeExe -PathType Leaf)) { throw "staged preview example missing: $smokeExe" }
          $systemPath = @(
            (Join-Path $env:SystemRoot "System32"),
            $env:SystemRoot,
            (Join-Path $env:SystemRoot "System32\WindowsPowerShell\v1.0")
          )
          foreach ($dir in @($stage) + $systemPath) {
            if (!(Test-Path -LiteralPath $dir -PathType Container)) { throw "smoke PATH directory missing: $dir" }
          }
          $env:PATH = (@($stage) + $systemPath) -join [IO.Path]::PathSeparator
          $smokeOutput = ""
          $exitCode = -1
          try {
            $smokeOutput = (& $smokeExe $corpus | Out-String)
            $exitCode = $LASTEXITCODE
          } catch {
            $smokeOutput = $_.Exception.Message
            $exitCode = -1
          }
          if ($smokeOutput.Length -gt 2000) { $smokeOutput = $smokeOutput.Substring($smokeOutput.Length - 2000) }
          $status = "fail"
          if ($exitCode -eq 0) { $status = "pass" }
          $evidenceDir = $env:IRIS_VALIDATION_EVIDENCE
          New-Item -ItemType Directory -Force -Path $evidenceDir | Out-Null
          $record = @{
            status = $status
            exit_code = $exitCode
            executable = "preview_corpus_smoke.exe"
            stage = $stage
            path = "stage+system"
            output_tail = $smokeOutput
          }
          Set-Content -LiteralPath (Join-Path $evidenceDir "preview-smoke.json") -Value ($record | ConvertTo-Json -Depth 4 -Compress) -Encoding utf8
          if ($exitCode -ne 0) { throw "installed preview smoke failed with exit code $exitCode" }

      - name: Assemble clean product ZIP payload
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Copy only inventory-named files out of the smoke stage, so helper
          # binaries and toolchain DLLs cannot leak into the rehearsal ZIP.
          $inventoryPath = Join-Path $env:IRIS_VALIDATION_EVIDENCE "product-inventory.json"
          if (!(Test-Path -LiteralPath $inventoryPath -PathType Leaf)) { throw "product inventory missing: $inventoryPath" }
          $inventory = Get-Content -LiteralPath $inventoryPath -Raw | ConvertFrom-Json
          if (@($inventory.files).Count -eq 0) { throw "product inventory empty" }
          $clean = Join-Path $env:RUNNER_TEMP "iris-product-clean"
          if (Test-Path -LiteralPath $clean) { Remove-Item -Recurse -Force -LiteralPath $clean }
          New-Item -ItemType Directory -Force -Path $clean | Out-Null
          foreach ($item in @($inventory.files)) {
            $name = [string]$item.name
            if ($name -ne [IO.Path]::GetFileName($name) -or $name -eq ".." -or $name -match '[\\/]') { throw "unsafe product inventory name: $name" }
            $source = Join-Path $env:IRIS_VALIDATION_STAGE $name
            if (!(Test-Path -LiteralPath $source -PathType Leaf)) { throw "staged product file missing: $name" }
            Copy-Item -LiteralPath $source -Destination (Join-Path $clean $name) -Force
          }
          $zipPath = Join-Path $env:RUNNER_TEMP "iris-product-rehearsal.zip"
          if (Test-Path -LiteralPath $zipPath) { Remove-Item -LiteralPath $zipPath -Force }
          "IRIS_PRODUCT_STAGE=$clean" >> $env:GITHUB_ENV
          "IRIS_PRODUCT_INVENTORY=$inventoryPath" >> $env:GITHUB_ENV
          "IRIS_PRODUCT_ZIP=$zipPath" >> $env:GITHUB_ENV
          # GITHUB_ENV only reaches later steps; the child pwsh below runs in
          # this step, so bind the same values in the current process too.
          $env:IRIS_PRODUCT_STAGE = $clean
          $env:IRIS_PRODUCT_INVENTORY = $inventoryPath
          $env:IRIS_PRODUCT_ZIP = $zipPath
          pwsh scripts/windows-product-package.ps1
          if ($LASTEXITCODE -ne 0) { throw "product package rehearsal failed" }

      - name: Verify product ZIP entry inventory
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $inventory = Get-Content -LiteralPath $env:IRIS_PRODUCT_INVENTORY -Raw | ConvertFrom-Json
          $expected = @{}
          foreach ($item in @($inventory.files)) {
            $name = [string]$item.name
            if ($name -ne [IO.Path]::GetFileName($name) -or $name -eq ".." -or $name -match '[\\/]') { throw "unsafe product inventory entry: $name" }
            $expected[$name.ToLowerInvariant()] = @{ sha256 = ([string]$item.sha256).ToLowerInvariant(); bytes = [long]$item.bytes }
          }
          if ($expected.Count -eq 0 -or $expected.Count -gt 256) { throw "product inventory bounds exceeded" }
          $seen = @{}
          $archive = [IO.Compression.ZipFile]::OpenRead($env:IRIS_PRODUCT_ZIP)
          try {
            foreach ($entry in $archive.Entries) {
              $name = $entry.FullName
              if ($name -ne [IO.Path]::GetFileName($name) -or $name -eq ".." -or $name -match '[\\/]') { throw "unsafe zip entry: $name" }
              $key = $name.ToLowerInvariant()
              if (!$expected.ContainsKey($key)) { throw "unexpected zip entry: $name" }
              if ($seen.ContainsKey($key)) { throw "duplicate zip entry: $name" }
              $stream = $entry.Open()
              try {
                $sha = [System.Security.Cryptography.SHA256]::Create()
                try {
                  $hash = [BitConverter]::ToString($sha.ComputeHash($stream)).Replace("-", "").ToLowerInvariant()
                } finally { $sha.Dispose() }
              } finally { $stream.Dispose() }
              if ($hash -ne $expected[$key].sha256) { throw "zip entry hash mismatch: $name" }
              if ($entry.Length -ne $expected[$key].bytes) { throw "zip entry byte mismatch: $name" }
              $seen[$key] = $true
            }
          } finally { $archive.Dispose() }
          $missing = @($expected.Keys | Where-Object { !$seen.ContainsKey($_) })
          $extra = @($seen.Keys | Where-Object { !$expected.ContainsKey($_) })
          $equal = ($seen.Count -eq $expected.Count -and $missing.Count -eq 0 -and $extra.Count -eq 0)
          if (!$equal) { throw "product zip entry inventory mismatch" }
          $result = @{
            status = "pass"
            zip_sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $env:IRIS_PRODUCT_ZIP).Hash.ToLowerInvariant()
            entry_count = $seen.Count
            inventory_equal = $equal
          }
          $evidenceDir = $env:IRIS_VALIDATION_EVIDENCE
          New-Item -ItemType Directory -Force -Path $evidenceDir | Out-Null
          Set-Content -LiteralPath (Join-Path $evidenceDir "product-package-rehearsal.json") -Value ($result | ConvertTo-Json -Depth 4 -Compress) -Encoding utf8

      - name: Assemble bounded evidence manifest
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          ev = Path(os.environ["IRIS_VALIDATION_EVIDENCE"])
          ev.mkdir(parents=True, exist_ok=True)
          def report(path, decode=None):
              if not path.exists():
                  return {"status": "not_run"}
              try:
                  text = path.read_text()
                  return {"status": "recorded", "data": decode(text) if decode else text[-8000:]}
              except (ValueError, OSError):
                  return {"status": "invalid"}

          inputs = report(ev / "validation-inputs.json", json.loads)
          closure = report(ev / "pe-import-closure.json", json.loads)
          smoke = report(ev / "preview-smoke.json", json.loads)
          package = report(ev / "product-package-rehearsal.json", json.loads)
          out = dict(validation_inputs=inputs, pe_import_closure=closure,
                     preview_smoke=smoke, product_package_rehearsal=package,
                     release_promotion=False, native_runtime_retained=False)
          (ev / "windows-validation.json").write_text(json.dumps(out, indent=2) + "\n")
          PY

      - name: Clean temporary native bytes even after interruption
        if: always()
        shell: bash
        run: |
          for native_dir in "${IRIS_VALIDATION_STAGE:-}" "${IRIS_VALIDATION_PDFIUM_RUNTIME:-}" "${IRIS_PRODUCT_STAGE:-}" "${RUNNER_TEMP:-}/iris-runtime-stage" "${RUNNER_TEMP:-}/iris-product-clean" "${RUNNER_TEMP:-}/pdfium-extract" "${RUNNER_TEMP:-}/pdfium-runtime"; do
            if [ -n "$native_dir" ] && [ -d "$native_dir" ]; then rm -rf "$native_dir"; fi
          done
          for native_file in "${IRIS_PRODUCT_ZIP:-}" "${RUNNER_TEMP:-}/iris-product-rehearsal.zip"; do
            if [ -n "$native_file" ] && [ -f "$native_file" ]; then rm -f "$native_file"; fi
          done
          rm -rf build/validation/ffmpeg-src build/validation/overlay target/debug target/release .vcpkg-validation/installed

      - name: Retain bounded JSON evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-validation-evidence
          if-no-files-found: error
          path: |
            build/validation/evidence/validation-inputs.json
            build/validation/evidence/windows-validation.json
            build/validation/evidence/pe-import-closure.json
            build/validation/evidence/preview-smoke.json
            build/validation/evidence/product-package-rehearsal.json
            build/validation/evidence/product-inventory.json
          retention-days: 7
          compression-level: 9
