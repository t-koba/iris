name: CI

on:
  push:
    branches-ignore:
      - mizu
    tags:
      - '**'
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  IRIS_SNAPSHOT_UPDATE: "0"
  INSTA_UPDATE: no
  IRIS_MACOS_DEPLOYMENT_TARGET: "14.0"
  MACOSX_DEPLOYMENT_TARGET: "14.0"
  IRIS_MAX_LINUX_RELEASE_BYTES: "35651584"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      attestations: read

    steps:
      - uses: actions/checkout@v7

      - name: Workflow trigger policy regression
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/test-workflow-triggers.py

      - name: Release audit contract regression
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/test-release-audit.py

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}-cargo

      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config clang ffmpeg netcat-openbsd openssh-client ripgrep zsh dpkg-dev build-essential nasm patchelf curl gnupg debootstrap debian-archive-keyring gpgv ca-certificates zlib1g-dev libbz2-dev liblzma-dev \
            libavcodec-dev libavformat-dev libavutil-dev libavfilter-dev \
            libavdevice-dev libswscale-dev libswresample-dev

      - name: Install system dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install ffmpeg pkg-config

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --no-deps --locked -- -D warnings

      - name: Library panic-path policy
        run: cargo clippy --workspace --lib --no-deps --locked -- -D warnings -D clippy::unwrap_used

      - name: Install cargo-audit
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Dependency security audit
        if: matrix.os == 'ubuntu-latest'
        run: bash ./scripts/audit-dependencies.sh

      - name: Install cargo-machete
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete

      - name: Unused dependency guard
        if: matrix.os == 'ubuntu-latest'
        run: cargo machete

      - name: Product default release build (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: s
        run: cargo build --release -p iris-ui-shell --locked

      - name: Product default release build (macOS)
        if: matrix.os == 'macos-latest'
        run: cargo build --release -p iris-ui-shell --locked

      - name: UI virtual scroll performance acceptance
        if: matrix.os == 'ubuntu-latest'
        env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: s
        run: cargo run --release -p iris-ui-shell --example virtual_scroll_perf --no-default-features --features minimal --locked

      - name: Product binary size upper bound
        if: matrix.os == 'ubuntu-latest'
        run: |
          actual=$(stat -c %s target/release/Iris)
          echo "Iris release binary: $actual bytes (limit: $IRIS_MAX_LINUX_RELEASE_BYTES)"
          test "$actual" -le "$IRIS_MAX_LINUX_RELEASE_BYTES"

      - name: Source safety policy
        if: matrix.os == 'ubuntu-latest'
        run: |
          command -v rg >/dev/null 2>&1 || { echo "required command is missing: rg" >&2; exit 1; }
          test -z "$(rg -n '#\[allow' crates --glob '*.rs' || true)"
          unsafe_files=$(rg -l '\bunsafe\b' crates --glob '*.rs' | rg -v '^(crates/backends/src/common.rs|crates/backends/src/localfs/reflink.rs|crates/platform-integration/src/trash.rs|crates/thumb-preview/src/image_generic.rs|crates/thumb-preview/src/pdf.rs|crates/ui-shell/src/macos_menu.rs)$' || true)
          test -z "$unsafe_files"
          unsafe_count=$(rg -n '\bunsafe\b' crates --glob '*.rs' | wc -l)
          # objc2 0.6 makes selector/super safety explicit with #[unsafe(...)];
          # the allowed-file list above still prevents the unsafe surface from spreading.
          echo "unsafe baseline count: $unsafe_count (limit: 73)"
          test "$unsafe_count" -le 73

      - name: Package Linux AppDir and Debian installer
        if: matrix.os == 'ubuntu-latest'
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          IRIS_VERIFY_PDFIUM_PROVENANCE: "1"
          IRIS_FFMPEG_FETCH_SECONDS: ${{ vars.IRIS_FFMPEG_FETCH_SECONDS || 300 }}
          IRIS_FFMPEG_FETCH_RETRIES: ${{ vars.IRIS_FFMPEG_FETCH_RETRIES || 1 }}
          IRIS_FFMPEG_FETCH_RETRY_DELAY_SECONDS: ${{ vars.IRIS_FFMPEG_FETCH_RETRY_DELAY_SECONDS || 2 }}
          GH_TOKEN: ${{ github.token }}
          IRIS_PDFIUM_FETCH_RETRIES: ${{ vars.IRIS_PDFIUM_FETCH_RETRIES || 3 }}
          IRIS_PDFIUM_FETCH_RETRY_DELAY_SECONDS: ${{ vars.IRIS_PDFIUM_FETCH_RETRY_DELAY_SECONDS || 2 }}
        run: ./scripts/package-linux-appdir.sh

      - name: Build PDFium smoke test
        if: matrix.os == 'ubuntu-latest'
        env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: s
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: cargo build --release -p iris-thumb-preview --example pdf_thumbnail_smoke --locked

      - name: Clean-installed Debian PDFium thumbnail smoke
        if: matrix.os == 'ubuntu-latest'
        run: |
          ./scripts/smoke-linux-deb.sh dist/linux/iris_*.deb dist/linux/Iris.AppDir \
            target/release/examples/pdf_thumbnail_smoke

      - name: Minimal release build
        run: cargo build --release -p iris-ui-shell --no-default-features --features minimal --locked

      - name: Install cargo-bloat
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-bloat

      - name: Minimal binary size guard
        if: matrix.os == 'ubuntu-latest'
        run: |
          command -v rg >/dev/null 2>&1 || { echo "required command is missing: rg" >&2; exit 1; }
          cargo bloat --release -p iris-ui-shell --no-default-features --features minimal -n 20 --crates > /tmp/iris-bloat.txt
          ! rg -i 'ffmpeg|pdfium' /tmp/iris-bloat.txt

      - name: UI shell integration smoke
        run: cargo test -p iris-ui-shell --test integration_smoke --locked

      - name: Thumb preview RAW smoke
        run: cargo test -p iris-thumb-preview --test golden --locked

      - name: Preview corpus fetch regression
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/test-fetch-preview-corpus.py

      - name: SFTP readiness deadline regression
        run: bash ./scripts/test-perf-transfer-readiness.sh

      - name: Samba failure log selection regression
        if: matrix.os == 'ubuntu-latest'
        run: bash ./scripts/test-perf-transfer-diagnostics.sh

      - name: Darwin native Samba startup regression
        run: bash ./scripts/test-perf-transfer-darwin.sh

      - name: Samba test-server policy regression
        if: matrix.os == 'ubuntu-latest'
        run: bash ./scripts/test-samba-builder.sh

      - name: Build local signed-snapshot Samba test server
        if: matrix.os == 'ubuntu-latest'
        run: |
          image=$(bash ./scripts/build-test-samba.sh)
          [[ "$image" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "IRIS_PERF_SAMBA_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Native SFTP and SMB container integration
        if: matrix.os == 'ubuntu-latest'
        env:
          IRIS_PERF_BYTES: "1048576"
          IRIS_PERF_SMALL_FILES: "8"
          IRIS_PERF_SMALL_BYTES: "1024"
          IRIS_PERF_SMB_PAGING_FILES: "5000"
          IRIS_PERF_SMB_MIN_PROTOCOL: "SMB3_11"
          IRIS_PERF_SMB_MAX_PROTOCOL: "SMB3_11"
          IRIS_PERF_SMB_SERVER_SIGNING: "mandatory"
          IRIS_PERF_SMB_ENCRYPTION: "required"
          IRIS_PERF_SMB_AUTH_AUDIT_LEVEL: "3"
        run: |
          diagnostic_output=$(mktemp)
          trap 'rm -f "$diagnostic_output"' EXIT
          status=0
          set +e
          bash ./scripts/perf-transfer-containers.sh 2>&1 | tee "$diagnostic_output"
          status=${PIPESTATUS[0]}
          set -e
          if grep -Fq 'SMB native stat parent directory failed: SMB Create returned unexpected status 0xc000000d' "$diagnostic_output"; then
            echo "Re-running a reduced SMB-only smoke with Samba debug level 10 for bounded CREATE diagnostics." >&2
            IRIS_PERF_SKIP_SFTP=1 \
              IRIS_PERF_BYTES=1 \
              IRIS_PERF_SMALL_FILES=1 \
              IRIS_PERF_SMALL_BYTES=1 \
              IRIS_PERF_SMB_PAGING_FILES=0 \
              IRIS_PERF_SMB_LOG_LEVEL=10 \
              bash ./scripts/perf-transfer-containers.sh || true
          fi
          exit "$status"

      - name: Native SMB 3.0 AES-CCM compatibility
        if: matrix.os == 'ubuntu-latest'
        env:
          IRIS_PERF_SKIP_SFTP: "1"
          IRIS_PERF_BYTES: "1048576"
          IRIS_PERF_SMALL_FILES: "1"
          IRIS_PERF_SMALL_BYTES: "1024"
          IRIS_PERF_SMB_PAGING_FILES: "256"
          IRIS_PERF_SMB_MIN_PROTOCOL: "SMB3_00"
          IRIS_PERF_SMB_MAX_PROTOCOL: "SMB3_00"
          IRIS_PERF_SMB_SERVER_SIGNING: "mandatory"
          IRIS_PERF_SMB_ENCRYPTION: "required"
        run: bash ./scripts/perf-transfer-containers.sh

      - name: Native SMB 2.1 signed compatibility
        if: matrix.os == 'ubuntu-latest'
        env:
          IRIS_PERF_SKIP_SFTP: "1"
          IRIS_PERF_BYTES: "1048576"
          IRIS_PERF_SMALL_FILES: "1"
          IRIS_PERF_SMALL_BYTES: "1024"
          IRIS_PERF_SMB_PAGING_FILES: "256"
          IRIS_PERF_SMB_MIN_PROTOCOL: "SMB2_10"
          IRIS_PERF_SMB_MAX_PROTOCOL: "SMB2_10"
          IRIS_PERF_SMB_SERVER_SIGNING: "mandatory"
          IRIS_PERF_SMB_ENCRYPTION: "off"
        run: bash ./scripts/perf-transfer-containers.sh

      - name: Remove local Samba test image
        if: always() && matrix.os == 'ubuntu-latest' && env.IRIS_PERF_SAMBA_IMAGE != ''
        run: docker image rm "$IRIS_PERF_SAMBA_IMAGE"

      - name: Install fuzz toolchain
        if: matrix.os == 'ubuntu-latest'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-11

      - name: Install cargo-fuzz
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Fuzz smoke
        if: matrix.os == 'ubuntu-latest'
        run: FUZZ_RUNS=1000 bash ./scripts/fuzz-all.sh

      - name: Default-feature preview corpus correctness and bounded latency smoke
        env:
          IRIS_PREVIEW_CORPUS_MAX_BYTES: "40000000"
          IRIS_PREVIEW_CORPUS_TIMEOUT_SECONDS: "60"
          IRIS_PREVIEW_CORPUS_RETRIES: ${{ vars.IRIS_PREVIEW_CORPUS_RETRIES || 1 }}
          IRIS_PREVIEW_CORPUS_RETRY_DELAY_SECONDS: ${{ vars.IRIS_PREVIEW_CORPUS_RETRY_DELAY_SECONDS || 2 }}
          IRIS_PREVIEW_LATENCY_WARMUPS: "2"
          IRIS_PREVIEW_LATENCY_SAMPLES: "21"
          CARGO_PROFILE_RELEASE_OPT_LEVEL: ${{ runner.os == 'Linux' && 's' || '3' }}
        run: |
          corpus_parent=$(mktemp -d "$RUNNER_TEMP/iris-preview.XXXXXX")
          trap 'rm -rf "$corpus_parent"' EXIT
          python3 scripts/fetch-preview-corpus.py --output "$corpus_parent/corpus"
          # PDFium loads from the existing pinned AppDir on Linux; macOS uses Core Graphics.
          if [[ "$RUNNER_OS" == Linux ]]; then
            cd "$GITHUB_WORKSPACE/dist/linux/Iris.AppDir/usr/lib/iris"
          fi
          cargo run --release --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" \
            -p iris-thumb-preview --example preview_corpus_smoke --locked -- "$corpus_parent/corpus"

  windows-minimal:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-cargo

      - name: Format
        run: cargo fmt --all --check

      - name: Minimal clippy
        run: cargo clippy -p iris-ui-shell --no-default-features --features minimal --all-targets --no-deps --locked -- -D warnings

      - name: Minimal release build
        run: cargo build --release -p iris-ui-shell --no-default-features --features minimal --locked

      - name: Windows local filesystem mutation regressions
        run: "cargo test -p iris-backends --lib common::tests:: --locked"

      - name: UI shell integration smoke
        run: cargo test -p iris-ui-shell --test integration_smoke --no-default-features --features minimal --locked

  linux-ffmpeg-validation:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    uses: ./.github/workflows/linux-ffmpeg-validation.yml

  windows-ffmpeg-prototype:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    uses: ./.github/workflows/windows-ffmpeg-prototype.yml

  macos-runtime-validation:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    uses: ./.github/workflows/macos-runtime-validation.yml
