      - name: Gate paired parity evidence
        shell: bash
        run: |
          status=0
          python3 scripts/release-parity.py --repo . --expected-sha "$GITHUB_SHA" audit/parity/linux.json audit/parity/macos.json audit/parity/windows.json > audit/parity/verifier.txt 2>&1 || status=$?
          cat audit/parity/verifier.txt
          exit "$status"
      - name: Retain parity verifier evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
