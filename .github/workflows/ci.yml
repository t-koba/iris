name: CI

on:
  push:
    branches-ignore:
      - mizu
    tags:
      - '**'
  pull_request:
  workflow_dispatch:
    inputs:
      validate_pdfium_candidate:
        description: Validate the unshipped PDFium 8179 candidate under the production gate
        type: boolean
        default: false
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  IRIS_SNAPSHOT_UPDATE: "0"
  INSTA_UPDATE: no
  IRIS_MACOS_DEPLOYMENT_TARGET: "14.0"
  MACOSX_DEPLOYMENT_TARGET: "14.0"
  IRIS_MAX_LINUX_RELEASE_BYTES: "35651584"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      attestations: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Workflow trigger policy regression
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/test-workflow-triggers.py

      - name: Release parity gate offline
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/test-release-parity.py

      - name: Release audit contract regression
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/test-release-audit.py
      - name: Dependency audit guard regression
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/test-audit-dependencies.py

      - name: Release policy gate regression
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/test-release-policy.py
      - name: macOS signing credential provisioning regression
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/test-macos-signing-provision.py
      - name: Windows FFmpeg provenance contract
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/test-windows-ffmpeg-provenance.py
      - name: Windows FFmpeg source acquisition contract
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/test-windows-ffmpeg-source.py
      - name: Windows FFmpeg overlay derivation contract
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/test-windows-ffmpeg-overlay.py
      - name: Windows release source bundle contract
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/test-windows-release-source-bundle.py
      - name: Windows FFmpeg validation input gate
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/windows-ffmpeg-validation-config.py
      - name: Windows FFmpeg validation config contract
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/test-windows-ffmpeg-validation-config.py
      - name: Windows FFmpeg validation workflow contract
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/test-windows-ffmpeg-validation-workflow.py
      - name: Windows PDFium 8179 candidate contract
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/test-windows-pdfium-candidate.py

      - name: Windows product package contract
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/test-windows-product-package.py

      - name: Windows release package contract
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/test-windows-package.py

      - name: Windows Authenticode signing contract
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/test-windows-signing.py

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: ${{ matrix.os }}-cargo

      - name: Restore validated Linux FFmpeg runtime
        if: matrix.os == 'ubuntu-latest'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/linux-ffmpeg
          key: ${{ runner.os }}-iris-ffmpeg-${{ hashFiles('packaging/linux/ffmpeg.json', 'scripts/build-linux-ffmpeg.sh', 'scripts/linux-ffmpeg.py', 'packaging/linux/ffmpeg-README.md') }}

      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config clang ffmpeg netcat-openbsd openssh-client ripgrep zsh dpkg-dev build-essential nasm patchelf curl gnupg debootstrap debian-archive-keyring gpgv ca-certificates zlib1g-dev libbz2-dev liblzma-dev \
            libavcodec-dev libavformat-dev libavutil-dev libavfilter-dev \
            libavdevice-dev libswscale-dev libswresample-dev

      - name: Install system dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install ffmpeg pkg-config

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --no-deps --locked -- -D warnings

      - name: S3 conflict policy regressions
        if: matrix.os == 'ubuntu-latest'
        run: cargo test -p iris-backends s3::adapter::tests --locked

      - name: macOS no-replace occupancy regressions
        if: matrix.os == 'macos-latest'
        run: "cargo test -p iris-backends --lib common::tests:: --locked"

      - name: SFTP staged mode regressions
        if: matrix.os == 'ubuntu-latest'
        run: cargo test -p iris-remote-transport sftp::tests --locked

      - name: pCloud credential ordering regressions
        if: matrix.os == 'ubuntu-latest'
        run: cargo test -p iris-ui-shell --lib runtime::backend_lifecycle::tests --locked

      - name: Directory transfer containment regressions
        if: matrix.os == 'ubuntu-latest'
        run: cargo test -p iris-ui-shell --lib runtime::transfer_driver::tests --locked

      - name: JPEG XR signature and decoder regressions
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo test -p iris-thumb-preview --lib modern_image::tests::detects_all_container_signatures --locked
          cargo test -p iris-thumb-preview --lib modern_image::tests::jpeg_xr_decoder_releases_after_failed_initialization --locked
          cargo test -p jpegxr --locked

      - name: JPEG 2000 decoder and registry guard regressions
        run: |
          cargo test -p iris-thumb-preview --lib modern_image::tests::decodes_jpeg2000_preview --locked
          cargo test -p iris-thumb-preview --lib modern_image::tests::rejects_truncated_jpeg2000_codestream --locked
          cargo test -p iris-thumb-preview --lib modern_image::tests::tlm_ --locked
          python3 scripts/test-jpeg2k-route.py

      - name: JPEG XR vendored decoder hardening regression
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/test-jxr-vendor-hardening.py

      - name: EXIF dependency security pin regression
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/test-exif-dependency.py

      - name: Paste compatibility facade regression
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/test-paste-compat.py

      - name: Block dependency regression
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/test-block-dependency.py

      - name: Path identity regressions
        run: |
          cargo test -p iris-core-domain --lib path_identity::tests:: --locked
          cargo test -p iris-catalog --lib schema::tests::snapshot_path_collation_uses_byte_equality_on_every_platform --locked
          cargo test -p iris-search --lib reconcile::tests::reconcile_path_identity_preserves_original_records_with_byte_equality --locked
          cargo test -p iris-ui-shell --lib state::cache::tests::thumbnail_keys_use_path_identity_but_preserve_display_spelling --locked

      - name: Library panic-path policy
        run: cargo clippy --workspace --lib --no-deps --locked -- -D warnings -D clippy::unwrap_used

      - name: Install cargo-audit
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2
        with:
          tool: cargo-audit

      - name: Dependency security audit
        if: matrix.os == 'ubuntu-latest'
        run: bash ./scripts/audit-dependencies.sh

      - name: Install cargo-machete
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2
        with:
          tool: cargo-machete

      - name: Unused dependency guard
        if: matrix.os == 'ubuntu-latest'
        run: cargo machete

      - name: Product default release build (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          export CARGO_PROFILE_RELEASE_OPT_LEVEL="$(python3 scripts/product_build_profile.py --platform linux)"
          cargo build --release -p iris-ui-shell --locked

      - name: Product default release build (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          export CARGO_PROFILE_RELEASE_OPT_LEVEL="$(python3 scripts/product_build_profile.py --platform macos)"
          cargo build --release -p iris-ui-shell --locked

      # The size limit checks the product-profile binary built above. Measure
      # scroll performance with that same shipped Linux profile so a regression
      # in the release payload cannot hide behind a faster benchmark build.
      - name: Product binary size upper bound
        if: matrix.os == 'ubuntu-latest'
        run: |
          actual=$(stat -c %s target/release/Iris)
          echo "Iris release binary: $actual bytes (limit: $IRIS_MAX_LINUX_RELEASE_BYTES)"
          test "$actual" -le "$IRIS_MAX_LINUX_RELEASE_BYTES"

      - name: UI virtual scroll performance acceptance
        if: matrix.os == 'ubuntu-latest'
        run: |
          export CARGO_PROFILE_RELEASE_OPT_LEVEL="$(python3 scripts/product_build_profile.py --platform linux)"
          cargo run --release -p iris-ui-shell --example virtual_scroll_perf --no-default-features --features minimal --locked

      - name: Source safety policy
        if: matrix.os == 'ubuntu-latest'
        run: |
          command -v rg >/dev/null 2>&1 || { echo "required command is missing: rg" >&2; exit 1; }
          test -z "$(rg -n '#\[allow' crates --glob '*.rs' || true)"
          unsafe_files=$(rg -l '\bunsafe\b' crates --glob '*.rs' | rg -v '^(crates/backends/src/common.rs|crates/backends/src/localfs/reflink.rs|crates/platform-integration/src/trash.rs|crates/thumb-preview/src/image_generic.rs|crates/thumb-preview/src/pdf.rs|crates/thumb-preview/src/video.rs|crates/thumb-preview/examples/preview_corpus_smoke.rs|crates/ui-shell/src/macos_menu.rs)$' || true)
          test -z "$unsafe_files"
          unsafe_count=$(rg -n '\bunsafe\b' crates --glob '*.rs' | wc -l)
          # objc2 0.6 makes selector/super safety explicit with #[unsafe(...)];
          # The video boundary keeps AVFrame.format raw and tests an invalid ID before scaling.
          # The parity smoke reads the loaded Windows PDFium module through
          # GetModuleHandleW/GetModuleFileNameW with explicit SAFETY notes.
          # The allowed-file list above still prevents the unsafe surface from spreading.
          echo "unsafe baseline count: $unsafe_count (limit: 77)"
          test "$unsafe_count" -le 77

      - name: Package Linux AppDir and Debian installer
        if: matrix.os == 'ubuntu-latest'
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          IRIS_VERIFY_PDFIUM_PROVENANCE: "1"
          IRIS_FFMPEG_FETCH_SECONDS: ${{ vars.IRIS_FFMPEG_FETCH_SECONDS || 300 }}
          IRIS_FFMPEG_FETCH_RETRIES: ${{ vars.IRIS_FFMPEG_FETCH_RETRIES || 1 }}
          IRIS_FFMPEG_FETCH_RETRY_DELAY_SECONDS: ${{ vars.IRIS_FFMPEG_FETCH_RETRY_DELAY_SECONDS || 2 }}
          GH_TOKEN: ${{ github.token }}
          IRIS_PDFIUM_FETCH_RETRIES: ${{ vars.IRIS_PDFIUM_FETCH_RETRIES || 3 }}
          IRIS_PDFIUM_FETCH_RETRY_DELAY_SECONDS: ${{ vars.IRIS_PDFIUM_FETCH_RETRY_DELAY_SECONDS || 2 }}
        run: ./scripts/package-linux-appdir.sh

      - name: Build PDFium smoke test
        if: matrix.os == 'ubuntu-latest'
        env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: s
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: cargo build --release -p iris-thumb-preview --example pdf_thumbnail_smoke --locked

      - name: Clean-installed Debian PDFium thumbnail smoke
        if: matrix.os == 'ubuntu-latest'
        run: |
          ./scripts/smoke-linux-deb.sh dist/linux/iris_*.deb dist/linux/Iris.AppDir \
            target/release/examples/pdf_thumbnail_smoke

      - name: Verify date-later PDFium candidate under the production gate
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'workflow_dispatch' && inputs.validate_pdfium_candidate
        env:
          IRIS_PDFIUM_PROFILE: "8179"
          IRIS_VERIFY_PDFIUM_PROVENANCE: "1"
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          stage=$(mktemp -d)
          trap 'rm -rf -- "$stage"' EXIT
          ./scripts/fetch-pdfium-runtime.sh "$stage"
          version="$stage/usr/share/doc/iris/pdfium/VERSION"
          provenance="$stage/usr/share/doc/iris/pdfium/PROVENANCE.json"
          grep -qx 'MAJOR=160' "$version"
          grep -qx 'BUILD=8179' "$version"
          status=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["attestation"]["status"])' "$provenance")
          [[ $status == verified ]] || { echo "PDFium candidate attestation status is $status" >&2; exit 1; }
          unset GH_TOKEN GITHUB_TOKEN
          # Bind only the staged library, then attribute the runtime record to it.
          library=$(realpath "$stage/usr/lib/iris/libpdfium.so")
          export IRIS_PDFIUM_REQUIRE_LIBRARY="$library"
          output="$stage/smoke-output.txt"
          (cd "$stage/usr/lib/iris" && "$GITHUB_WORKSPACE/target/release/examples/pdf_thumbnail_smoke") > "$output"
          cat "$output"
          python3 - "$library" "$output" <<'PY'
          import json
          from pathlib import Path
          import sys

          required = Path(sys.argv[1]).resolve(strict=True)
          text = Path(sys.argv[2]).read_text(encoding="utf-8")
          if len(text.encode("utf-8")) > 20_000:
              raise SystemExit("PDFium smoke output exceeds the evidence bound")
          records = [json.loads(line.split(" ", 1)[1]) for line in text.splitlines()
                     if line.startswith("PREVIEW_PDFIUM_RUNTIME ")]
          if len(records) != 1:
              raise SystemExit(f"expected one PREVIEW_PDFIUM_RUNTIME record, got {len(records)}")
          record = records[0]
          if record.get("required") is not True:
              raise SystemExit("PDFium runtime record is missing the opt-in gate")
          path = record.get("path")
          if not isinstance(path, str) or not path:
              raise SystemExit("PDFium runtime record has no library path")
          try:
              recorded = Path(path).resolve(strict=True)
          except OSError:
              raise SystemExit("PDFium runtime library path does not exist")
          if recorded != required:
              raise SystemExit("PDFium runtime library is not the staged candidate")
          print(f"PDFium runtime attributed to {required}")
          PY

      - name: Minimal release build
        run: cargo build --release -p iris-ui-shell --no-default-features --features minimal --locked

      - name: Install cargo-bloat
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2
        with:
          tool: cargo-bloat

      - name: Minimal binary size guard
        if: matrix.os == 'ubuntu-latest'
        run: |
          command -v rg >/dev/null 2>&1 || { echo "required command is missing: rg" >&2; exit 1; }
          cargo bloat --release -p iris-ui-shell --no-default-features --features minimal -n 20 --crates > /tmp/iris-bloat.txt
          ! rg -i 'ffmpeg|pdfium' /tmp/iris-bloat.txt

      - name: Tests
        run: cargo test --workspace --locked

      - name: UI shell integration smoke
        run: cargo test -p iris-ui-shell --test integration_smoke --locked

      - name: Thumb preview RAW smoke
        run: cargo test -p iris-thumb-preview --test golden --locked

      - name: Preview corpus fetch regression
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/test-fetch-preview-corpus.py

      - name: SFTP readiness deadline regression
        run: bash ./scripts/test-perf-transfer-readiness.sh

      - name: Samba failure log selection regression
        if: matrix.os == 'ubuntu-latest'
        run: bash ./scripts/test-perf-transfer-diagnostics.sh

      - name: Darwin native Samba startup regression
        run: bash ./scripts/test-perf-transfer-darwin.sh

      - name: Samba test-server policy regression
        if: matrix.os == 'ubuntu-latest'
        run: bash ./scripts/test-samba-builder.sh

      - name: Build local signed-snapshot Samba test server
        if: matrix.os == 'ubuntu-latest'
        run: |
          image=$(bash ./scripts/build-test-samba.sh)
          [[ "$image" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "IRIS_PERF_SAMBA_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Native SFTP and SMB container integration
        if: matrix.os == 'ubuntu-latest'
        env:
          IRIS_PERF_BYTES: "1048576"
          IRIS_PERF_SMALL_FILES: "8"
          IRIS_PERF_SMALL_BYTES: "1024"
          IRIS_PERF_SMB_PAGING_FILES: "5000"
          IRIS_PERF_SMB_MIN_PROTOCOL: "SMB3_11"
          IRIS_PERF_SMB_MAX_PROTOCOL: "SMB3_11"
          IRIS_PERF_SMB_SERVER_SIGNING: "mandatory"
          IRIS_PERF_SMB_ENCRYPTION: "required"
          IRIS_PERF_SMB_AUTH_AUDIT_LEVEL: "3"
        run: |
          diagnostic_output=$(mktemp)
          trap 'rm -f "$diagnostic_output"' EXIT
          status=0
          set +e
          bash ./scripts/perf-transfer-containers.sh 2>&1 | tee "$diagnostic_output"
          status=${PIPESTATUS[0]}
          set -e
          if grep -Eq '(returned unexpected status|QueryDirectory returned status) 0x(c000000d|c0000022)([^[:alnum:]_]|$)' "$diagnostic_output"; then
            echo "Re-running a reduced SMB-only smoke with Samba debug level 10 for bounded SMB diagnostics." >&2
            IRIS_PERF_SKIP_SFTP=1 \
              IRIS_PERF_BYTES=1 \
              IRIS_PERF_SMALL_FILES=1 \
              IRIS_PERF_SMALL_BYTES=1 \
              IRIS_PERF_SMB_PAGING_FILES=0 \
              IRIS_PERF_SMB_LOG_LEVEL=10 \
              IRIS_PERF_SMB2_CREDITS_LEVEL=10 \
              bash ./scripts/perf-transfer-containers.sh || true
          fi
          exit "$status"

      - name: Native SMB 3.0 AES-CCM compatibility
        if: matrix.os == 'ubuntu-latest'
        env:
          IRIS_PERF_SKIP_SFTP: "1"
          IRIS_PERF_BYTES: "1048576"
          IRIS_PERF_SMALL_FILES: "1"
          IRIS_PERF_SMALL_BYTES: "1024"
          IRIS_PERF_SMB_PAGING_FILES: "256"
          IRIS_PERF_SMB_MIN_PROTOCOL: "SMB3_00"
          IRIS_PERF_SMB_MAX_PROTOCOL: "SMB3_00"
          IRIS_PERF_SMB_SERVER_SIGNING: "mandatory"
          IRIS_PERF_SMB_ENCRYPTION: "required"
        run: bash ./scripts/perf-transfer-containers.sh

      - name: Native SMB 2.1 signed compatibility
        if: matrix.os == 'ubuntu-latest'
        env:
          IRIS_PERF_SKIP_SFTP: "1"
          IRIS_PERF_BYTES: "1048576"
          IRIS_PERF_SMALL_FILES: "1"
          IRIS_PERF_SMALL_BYTES: "1024"
          IRIS_PERF_SMB_PAGING_FILES: "256"
          IRIS_PERF_SMB_MIN_PROTOCOL: "SMB2_10"
          IRIS_PERF_SMB_MAX_PROTOCOL: "SMB2_10"
          IRIS_PERF_SMB_SERVER_SIGNING: "mandatory"
          IRIS_PERF_SMB_ENCRYPTION: "off"
        run: bash ./scripts/perf-transfer-containers.sh

      - name: Remove local Samba test image
        if: always() && matrix.os == 'ubuntu-latest' && env.IRIS_PERF_SAMBA_IMAGE != ''
        run: docker image rm "$IRIS_PERF_SAMBA_IMAGE"

      - name: Fuzz target routing regression
        if: matrix.os == 'ubuntu-latest'
        run: bash ./scripts/test-fuzz-target.sh

      - name: Install fuzz toolchain
        if: matrix.os == 'ubuntu-latest'
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: nightly-2026-07-11

      - name: Install cargo-fuzz
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2
        with:
          tool: cargo-fuzz

      - name: Fuzz smoke
        if: matrix.os == 'ubuntu-latest'
        env:
          # The cargo-fuzz binary installed on Linux may be musl-linked; its
          # inferred target is incompatible with ASan. Build for the runner's
          # GNU target so the nightly sanitizer runtime can link.
          IRIS_FUZZ_TARGET: x86_64-unknown-linux-gnu
        run: FUZZ_RUNS=1000 bash ./scripts/fuzz-all.sh

      - name: Default-feature preview corpus correctness and bounded latency smoke
        env:
          IRIS_PREVIEW_CORPUS_MAX_BYTES: "40000000"
          IRIS_PREVIEW_CORPUS_TIMEOUT_SECONDS: "60"
          IRIS_PREVIEW_CORPUS_RETRIES: ${{ vars.IRIS_PREVIEW_CORPUS_RETRIES || 4 }}
          IRIS_PREVIEW_CORPUS_RETRY_DELAY_SECONDS: ${{ vars.IRIS_PREVIEW_CORPUS_RETRY_DELAY_SECONDS || 2 }}
          IRIS_PREVIEW_CORPUS_MAX_RETRY_DELAY_SECONDS: ${{ vars.IRIS_PREVIEW_CORPUS_MAX_RETRY_DELAY_SECONDS || 30 }}
          IRIS_PREVIEW_LATENCY_WARMUPS: "2"
          IRIS_PREVIEW_LATENCY_SAMPLES: "21"
          CARGO_PROFILE_RELEASE_OPT_LEVEL: ${{ runner.os == 'Linux' && 's' || '3' }}
        run: |
          corpus_parent=$(mktemp -d "$RUNNER_TEMP/iris-preview.XXXXXX")
          trap 'rm -rf "$corpus_parent"' EXIT
          python3 scripts/fetch-preview-corpus.py --output "$corpus_parent/corpus"
          # PDFium loads from the existing pinned AppDir on Linux; macOS uses Core Graphics.
          if [[ "$RUNNER_OS" == Linux ]]; then
            cd "$GITHUB_WORKSPACE/dist/linux/Iris.AppDir/usr/lib/iris"
          fi
          cargo run --release --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" \
            -p iris-thumb-preview --example preview_corpus_smoke --locked -- "$corpus_parent/corpus"

  windows-minimal:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: windows-cargo

      - name: Format
        run: cargo fmt --all --check

      - name: Minimal clippy
        run: cargo clippy -p iris-ui-shell --no-default-features --features minimal --all-targets --no-deps --locked -- -D warnings

      - name: Minimal release build
        run: cargo build --release -p iris-ui-shell --no-default-features --features minimal --locked

      - name: Windows local filesystem mutation regressions
        run: "cargo test -p iris-backends --lib common::tests:: --locked"

      - name: Windows local path normalization regression
        shell: bash
        run: |
          status=0
          output=$(cargo test -p iris-path-service --lib --locked normalize::normalize_tests::normalize_local_path_uses_the_native_separator -- --exact 2>&1) || status=$?
          printf '%s\n' "$output"
          test "$status" -eq 0
          grep -Fq '1 passed; 0 failed' <<< "$output"

      - name: Windows drive breadcrumb regression
        shell: bash
        run: |
          status=0
          output=$(cargo test -p iris-ui-shell --lib --no-default-features --features minimal --locked runtime::directory::tests::local_breadcrumbs_start_at_the_drive -- --exact 2>&1) || status=$?
          printf '%s\n' "$output"
          test "$status" -eq 0
          grep -Fq '1 passed; 0 failed' <<< "$output"

      - name: Windows drive-root breadcrumb regression
        shell: bash
        run: |
          status=0
          output=$(cargo test -p iris-ui-shell --lib --no-default-features --features minimal --locked runtime::directory::tests::local_breadcrumbs_merges_root_into_the_drive_crumb -- --exact 2>&1) || status=$?
          printf '%s\n' "$output"
          test "$status" -eq 0
          grep -Fq '1 passed; 0 failed' <<< "$output"

      - name: UI shell integration smoke
        run: cargo test -p iris-ui-shell --test integration_smoke --no-default-features --features minimal --locked

