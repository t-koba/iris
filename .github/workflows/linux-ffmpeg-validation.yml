name: Linux FFmpeg validation

# Reusable, report-only Linux runtime validation. The registered CI workflow
# calls this only on workflow_dispatch at the caller's exact ref. Never dispatch
# Release or retain packages, AppDirs, source bundles, or runtime libraries.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/linux-runtime-validation
      CARGO_PROFILE_RELEASE_OPT_LEVEL: s
      IRIS_FFMPEG_PREFIX: ${{ github.workspace }}/target/linux-ffmpeg
      FFMPEG_DIR: ${{ github.workspace }}/target/linux-ffmpeg
      PKG_CONFIG_LIBDIR: ${{ github.workspace }}/target/linux-ffmpeg/lib/pkgconfig
      PKG_CONFIG_PATH: ${{ github.workspace }}/target/linux-ffmpeg/lib/pkgconfig
      IRIS_BUILD_VARIANT: product
      IRIS_VERIFY_PDFIUM_PROVENANCE: "0"
      IRIS_MAX_LINUX_RELEASE_BYTES: "35651584"
      # Shared pinned corpus and repeated diagnostic budget; only JSON is retained.
      IRIS_PREVIEW_CORPUS_MAX_BYTES: ${{ vars.IRIS_PREVIEW_CORPUS_MAX_BYTES || 40000000 }}
      IRIS_PREVIEW_CORPUS_TIMEOUT_SECONDS: ${{ vars.IRIS_PREVIEW_CORPUS_TIMEOUT_SECONDS || 60 }}
      IRIS_PREVIEW_CORPUS_RETRIES: ${{ vars.IRIS_PREVIEW_CORPUS_RETRIES || 1 }}
      IRIS_PREVIEW_CORPUS_RETRY_DELAY_SECONDS: ${{ vars.IRIS_PREVIEW_CORPUS_RETRY_DELAY_SECONDS || 2 }}
      IRIS_PREVIEW_LATENCY_WARMUPS: ${{ vars.IRIS_PREVIEW_LATENCY_WARMUPS || 2 }}
      IRIS_PREVIEW_LATENCY_SAMPLES: ${{ vars.IRIS_PREVIEW_LATENCY_SAMPLES || 21 }}
      IRIS_FFMPEG_FETCH_SECONDS: ${{ vars.IRIS_FFMPEG_FETCH_SECONDS || 300 }}
      IRIS_FFMPEG_FETCH_RETRIES: ${{ vars.IRIS_FFMPEG_FETCH_RETRIES || 1 }}
      IRIS_FFMPEG_FETCH_RETRY_DELAY_SECONDS: ${{ vars.IRIS_FFMPEG_FETCH_RETRY_DELAY_SECONDS || 2 }}
      IRIS_FFMPEG_COMMAND_SECONDS: ${{ vars.IRIS_FFMPEG_COMMAND_SECONDS || 60 }}
      IRIS_FFMPEG_COMMAND_BYTES: ${{ vars.IRIS_FFMPEG_COMMAND_BYTES || 32768 }}
      IRIS_FFMPEG_JOBS: ${{ vars.IRIS_FFMPEG_JOBS || 2 }}
      IRIS_FFMPEG_MAX_REPORT_BYTES: ${{ vars.IRIS_FFMPEG_MAX_REPORT_BYTES || 266240 }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Install build tools (not system FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang nasm pkg-config patchelf zsh dpkg-dev curl gnupg zlib1g-dev libbz2-dev liblzma-dev
      - name: Check lightweight runtime contracts
        run: python3 scripts/test-linux-ffmpeg.py
      - name: Fetch locked Rust inputs
        run: cargo fetch --locked
      - name: Build verified FFmpeg and package default product locally
        run: ./scripts/package-linux-appdir.sh
      - name: Locked offline Rust checks and smoke build
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --no-deps --locked --offline -- -D warnings
          cargo test -p iris-thumb-preview --example preview_corpus_smoke --locked --offline
          cargo build --release -p iris-thumb-preview --example pdf_thumbnail_smoke --example video_thumbnail_smoke --example preview_corpus_smoke --locked --offline
      - name: Generate built-in codec clip and smoke AppDir
        shell: bash
        run: |
          LD_LIBRARY_PATH="$IRIS_FFMPEG_PREFIX/lib" "$IRIS_FFMPEG_PREFIX/bin/ffmpeg" \
            -nostdin -v error -f lavfi -i testsrc2=size=64x48:rate=4 -t 1 -c:v mpeg4 -an "$RUNNER_TEMP/iris-video.avi"
          for kind in pdf video; do
            cp "$CARGO_TARGET_DIR/release/examples/${kind}_thumbnail_smoke" "dist/linux/Iris.AppDir/usr/bin/iris-${kind}-smoke"
            patchelf --set-rpath '$ORIGIN/../lib/iris' "dist/linux/Iris.AppDir/usr/bin/iris-${kind}-smoke"
          done
          dist/linux/Iris.AppDir/usr/bin/iris-video-smoke "$RUNNER_TEMP/iris-video.avi"
          dist/linux/Iris.AppDir/usr/bin/iris-pdf-smoke
          cp "$CARGO_TARGET_DIR/release/examples/preview_corpus_smoke" dist/linux/Iris.AppDir/usr/bin/iris-corpus-smoke
          patchelf --set-rpath '$ORIGIN/../lib/iris' dist/linux/Iris.AppDir/usr/bin/iris-corpus-smoke
          # The check inspects the actual staged Iris, not the clip generator.
          python3 scripts/linux-ffmpeg.py check dist/linux/Iris.AppDir dist/linux/ffmpeg-audit.json
      - name: Clean-installed Debian runtime and thumbnail smoke
        shell: bash
        run: |
          ./scripts/smoke-linux-deb.sh dist/linux/iris_*.deb dist/linux/Iris.AppDir \
            dist/linux/Iris.AppDir/usr/bin/iris-pdf-smoke \
            dist/linux/Iris.AppDir/usr/bin/iris-video-smoke "$RUNNER_TEMP/iris-video.avi"
      - name: Summarize bounded evidence (no packages or libraries)
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, importlib.util, json, os, subprocess, sys, tempfile
          from pathlib import Path
          staged = json.loads(Path('dist/linux/ffmpeg-audit.json').read_text())
          installed = json.loads(Path('dist/linux/installed-ffmpeg-audit.json').read_text())
          assert staged == installed, 'installed runtime differs from AppDir'
          assert staged['source_sha'] == os.environ['GITHUB_SHA']
          deb, = Path('dist/linux').glob('*.deb')
          staged['debian'] = dict(sha256=hashlib.sha256(deb.read_bytes()).hexdigest(),
                                  depends=subprocess.check_output(['dpkg-deb', '-f', str(deb), 'Depends'], text=True).strip())
          assert staged['debian']['depends'] == staged['system_requirements']
          # Run the staged default-feature smoke once; retain its bounded records, never its fixtures/logs.
          report_spec = importlib.util.spec_from_file_location(
              'preview_corpus_report', 'scripts/preview_corpus_report.py')
          preview_report = importlib.util.module_from_spec(report_spec)
          report_spec.loader.exec_module(preview_report)
          with tempfile.TemporaryDirectory(prefix='iris-corpus-', dir=os.environ['RUNNER_TEMP']) as temporary:
              corpus = Path(temporary) / 'corpus'
              subprocess.run([sys.executable, 'scripts/fetch-preview-corpus.py', '--output', str(corpus)],
                             check=True, timeout=int(os.environ['IRIS_FFMPEG_FETCH_SECONDS']))
              smoke = subprocess.run(
                  [str(Path('dist/linux/Iris.AppDir/usr/bin/iris-corpus-smoke').resolve()), str(corpus)],
                  check=True, capture_output=True, text=True,
                  timeout=int(os.environ['IRIS_FFMPEG_COMMAND_SECONDS']))
              staged['preview'] = preview_report.parse_preview(
                  smoke.stdout, os.environ['GITHUB_SHA'], target_os='linux')
          pdfium_docs = Path('dist/linux/Iris.AppDir/usr/share/doc/iris/pdfium')
          pdfium = json.loads((pdfium_docs / 'PROVENANCE.json').read_text())
          pdfium_library = Path('dist/linux/Iris.AppDir/usr/lib/iris/libpdfium.so')
          with pdfium_library.open('rb') as stream:
              pdfium_digest = hashlib.file_digest(stream, 'sha256').hexdigest()
          assert pdfium['runtime']['sha256'] == pdfium_digest
          assert pdfium['attestation']['status'] == 'not_attempted'
          staged['preview']['pdf_runtime_identity'] = dict(
              version=(pdfium_docs / 'VERSION').read_text().strip(),
              asset_sha256=pdfium['archive']['sha256'], library_sha256=pdfium_digest,
              attestation_status=pdfium['attestation']['status'])
          staged['preview']['scope'] = 'Report-only staged default-feature PDFium diagnostic; not an FFmpeg effect, cross-platform comparison, UI latency, attestation or release approval.'
          staged['validation'] = dict(appdir_video=True, appdir_pdf=True, installed_video=True, installed_pdf=True,
                                      appdir_corpus=True)
          report = json.dumps(staged, indent=2) + '\n'
          assert len(report.encode()) <= int(os.environ['IRIS_FFMPEG_MAX_REPORT_BYTES'])
          Path('audit').mkdir(exist_ok=True)
          Path('audit/linux-ffmpeg.json').write_text(report)
          PY
      - name: Retain JSON evidence only
        uses: actions/upload-artifact@v4
        with:
          name: linux-ffmpeg-audit
          if-no-files-found: error
          path: audit/linux-ffmpeg.json
