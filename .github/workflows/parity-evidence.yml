name: Parity evidence

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact source revision to pair with the pinned baseline
        required: true
        type: string

permissions:
  contents: read

jobs:
  parity-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      IRIS_PREVIEW_CORPUS_MAX_BYTES: ${{ vars.IRIS_PREVIEW_CORPUS_MAX_BYTES || 40000000 }}
      IRIS_PREVIEW_CORPUS_TIMEOUT_SECONDS: ${{ vars.IRIS_PREVIEW_CORPUS_TIMEOUT_SECONDS || 60 }}
      IRIS_PREVIEW_CORPUS_RETRIES: ${{ vars.IRIS_PREVIEW_CORPUS_RETRIES || 4 }}
      IRIS_PREVIEW_CORPUS_RETRY_DELAY_SECONDS: ${{ vars.IRIS_PREVIEW_CORPUS_RETRY_DELAY_SECONDS || 2 }}
      IRIS_PREVIEW_CORPUS_MAX_RETRY_DELAY_SECONDS: ${{ vars.IRIS_PREVIEW_CORPUS_MAX_RETRY_DELAY_SECONDS || 30 }}
      IRIS_PREVIEW_LATENCY_WARMUPS: ${{ vars.IRIS_PREVIEW_LATENCY_WARMUPS || 2 }}
      IRIS_PREVIEW_LATENCY_SAMPLES: ${{ vars.IRIS_PREVIEW_LATENCY_SAMPLES || 21 }}
      IRIS_PDFIUM_FETCH_RETRIES: ${{ vars.IRIS_PDFIUM_FETCH_RETRIES || 3 }}
      IRIS_PDFIUM_FETCH_RETRY_DELAY_SECONDS: ${{ vars.IRIS_PDFIUM_FETCH_RETRY_DELAY_SECONDS || 2 }}
      IRIS_FFMPEG_JOBS: ${{ vars.IRIS_FFMPEG_JOBS || 2 }}
      IRIS_FFMPEG_FETCH_SECONDS: ${{ vars.IRIS_FFMPEG_FETCH_SECONDS || 300 }}
      IRIS_FFMPEG_FETCH_RETRIES: ${{ vars.IRIS_FFMPEG_FETCH_RETRIES || 1 }}
      IRIS_FFMPEG_FETCH_RETRY_DELAY_SECONDS: ${{ vars.IRIS_FFMPEG_FETCH_RETRY_DELAY_SECONDS || 2 }}
      IRIS_FFMPEG_PREFIX: ${{ github.workspace }}/build/linux-ffmpeg
      FFMPEG_DIR: ${{ github.workspace }}/build/linux-ffmpeg
      PKG_CONFIG_PATH: ${{ github.workspace }}/build/linux-ffmpeg/lib/pkgconfig
      PKG_CONFIG_LIBDIR: ${{ github.workspace }}/build/linux-ffmpeg/lib/pkgconfig
      LD_LIBRARY_PATH: ${{ github.workspace }}/build/linux-ffmpeg/lib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch pinned baseline commit for paired parity
        shell: bash
        run: |
          git fetch origin refs/heads/main
          git cat-file -e 8e55c491f27b3cb9ca7c7245610812d3e7dcb5cc^{commit}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: parity-linux-cargo
      - name: Install product build tools (no system FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh pkg-config clang dpkg-dev build-essential nasm patchelf curl gnupg zlib1g-dev libbz2-dev liblzma-dev
      - name: Fetch locked Rust inputs before offline parity runs
        run: cargo fetch --locked
      - name: Build and validate pinned FFmpeg runtime for Linux parity smoke
        run: |
          ./scripts/build-linux-ffmpeg.sh
          python3 scripts/linux-ffmpeg.py validate "$IRIS_FFMPEG_PREFIX"
          test "$(pkg-config --variable=prefix libavcodec)" = "$IRIS_FFMPEG_PREFIX"
      - name: Stage pinned PDFium runtime for Linux parity smoke
        env:
          IRIS_VERIFY_PDFIUM_PROVENANCE: "0"
        run: |
          ./scripts/fetch-pdfium-runtime.sh "$RUNNER_TEMP/iris-pdfium-stage"
          sudo install -m 0755 "$RUNNER_TEMP/iris-pdfium-stage/usr/lib/iris/libpdfium.so" /usr/local/lib/libpdfium.so
          sudo ldconfig
          test -f /usr/local/lib/libpdfium.so
      - name: Fetch preview corpus bytes
        run: python3 scripts/fetch-preview-corpus.py --output "$RUNNER_TEMP/iris-preview-corpus"
      - name: Apply product build profile to Linux parity smoke
        shell: bash
        run: |
          echo "CARGO_PROFILE_RELEASE_OPT_LEVEL=$(python3 scripts/product_build_profile.py --platform linux)" >> "$GITHUB_ENV"
      - name: Produce Linux paired-source parity report
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: python3 scripts/parity_source_compare.py --repo . --candidate "$SOURCE_SHA" --corpus "$RUNNER_TEMP/iris-preview-corpus" --pdfium-library "$RUNNER_TEMP/iris-pdfium-stage/usr/lib/iris/libpdfium.so" --output audit/parity/linux.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: parity-linux
          path: audit/parity/linux.json
          if-no-files-found: error

  parity-macos:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      IRIS_FFMPEG_JOBS: ${{ vars.IRIS_FFMPEG_JOBS || 2 }}
      IRIS_FFMPEG_BUILD_SECONDS: ${{ vars.IRIS_FFMPEG_BUILD_SECONDS || 3600 }}
      IRIS_FFMPEG_FETCH_SECONDS: ${{ vars.IRIS_FFMPEG_FETCH_SECONDS || 300 }}
      IRIS_FFMPEG_FETCH_RETRIES: ${{ vars.IRIS_FFMPEG_FETCH_RETRIES || 1 }}
      IRIS_FFMPEG_FETCH_RETRY_DELAY_SECONDS: ${{ vars.IRIS_FFMPEG_FETCH_RETRY_DELAY_SECONDS || 2 }}
      IRIS_FFMPEG_COMMAND_SECONDS: ${{ vars.IRIS_FFMPEG_COMMAND_SECONDS || 60 }}
      IRIS_FFMPEG_COMMAND_BYTES: ${{ vars.IRIS_FFMPEG_COMMAND_BYTES || 32768 }}
      IRIS_FFMPEG_MAX_NATIVE_FILES: ${{ vars.IRIS_FFMPEG_MAX_NATIVE_FILES || 256 }}
      IRIS_FFMPEG_MAX_REPORT_BYTES: ${{ vars.IRIS_FFMPEG_MAX_REPORT_BYTES || 266240 }}
      IRIS_PREVIEW_CORPUS_MAX_BYTES: ${{ vars.IRIS_PREVIEW_CORPUS_MAX_BYTES || 40000000 }}
      IRIS_PREVIEW_CORPUS_TIMEOUT_SECONDS: ${{ vars.IRIS_PREVIEW_CORPUS_TIMEOUT_SECONDS || 60 }}
      IRIS_PREVIEW_CORPUS_RETRIES: ${{ vars.IRIS_PREVIEW_CORPUS_RETRIES || 4 }}
      IRIS_PREVIEW_CORPUS_RETRY_DELAY_SECONDS: ${{ vars.IRIS_PREVIEW_CORPUS_RETRY_DELAY_SECONDS || 2 }}
      IRIS_PREVIEW_CORPUS_MAX_RETRY_DELAY_SECONDS: ${{ vars.IRIS_PREVIEW_CORPUS_MAX_RETRY_DELAY_SECONDS || 30 }}
      IRIS_PREVIEW_LATENCY_WARMUPS: ${{ vars.IRIS_PREVIEW_LATENCY_WARMUPS || 2 }}
      IRIS_PREVIEW_LATENCY_SAMPLES: ${{ vars.IRIS_PREVIEW_LATENCY_SAMPLES || 21 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch pinned baseline commit for paired parity
        shell: bash
        run: |
          git fetch origin refs/heads/main
          git cat-file -e 8e55c491f27b3cb9ca7c7245610812d3e7dcb5cc^{commit}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: parity-macos-cargo
          cache-targets: false
      - name: Install system dependencies
        run: brew install pkg-config gnupg nasm cmake
      - name: Fetch locked Rust inputs before offline parity runs
        run: cargo fetch --locked
      - name: Validate pinned macOS runtime contracts
        run: python3 scripts/test-macos-ffmpeg.py
      - name: Build pinned FFmpeg runtime for macOS parity smoke
        shell: bash
        run: |
          prefix="$RUNNER_TEMP/iris-ffmpeg-pinned"
          python3 scripts/macos-ffmpeg.py prepare "$prefix"
          {
            echo "FFMPEG_DIR=$prefix"
            echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig"
            echo "PKG_CONFIG_LIBDIR=$prefix/lib/pkgconfig"
            echo "DYLD_LIBRARY_PATH=$prefix/lib${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}"
          } >> "$GITHUB_ENV"
          test "$(pkg-config --variable=prefix libavcodec)" = "$prefix"
      - name: Fetch preview corpus bytes
        run: python3 scripts/fetch-preview-corpus.py --output "$RUNNER_TEMP/iris-preview-corpus"
      - name: Apply product build profile to macOS parity smoke
        shell: bash
        run: |
          echo "CARGO_PROFILE_RELEASE_OPT_LEVEL=$(python3 scripts/product_build_profile.py --platform macos)" >> "$GITHUB_ENV"
      - name: Produce macOS paired-source parity report
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: python3 scripts/parity_source_compare.py --repo . --candidate "$SOURCE_SHA" --corpus "$RUNNER_TEMP/iris-preview-corpus" --output audit/parity/macos.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: parity-macos
          path: audit/parity/macos.json
          if-no-files-found: error

  parity-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-validation
      VCPKG_INSTALLED_DIR: ${{ github.workspace }}/.vcpkg-validation/installed
      VCPKG_TARGET_TRIPLET: x64-windows-iris-dynamic
      VCPKG_DEFAULT_TRIPLET: x64-windows-iris-dynamic
      VCPKGRS_TRIPLET: x64-windows-iris-dynamic
      VCPKGRS_DYNAMIC: "1"
      IRIS_VALIDATION_TRIPLET: x64-windows-iris-dynamic
      IRIS_VALIDATION_SOURCE: ${{ github.workspace }}/build/validation/ffmpeg-src
      IRIS_VALIDATION_OVERLAY: ${{ github.workspace }}/build/validation/overlay
      IRIS_VALIDATION_EVIDENCE: ${{ github.workspace }}/build/validation/evidence
      IRIS_PREVIEW_CORPUS_MAX_BYTES: ${{ vars.IRIS_PREVIEW_CORPUS_MAX_BYTES || 40000000 }}
      IRIS_PREVIEW_CORPUS_TIMEOUT_SECONDS: ${{ vars.IRIS_PREVIEW_CORPUS_TIMEOUT_SECONDS || 60 }}
      IRIS_PREVIEW_CORPUS_RETRIES: ${{ vars.IRIS_PREVIEW_CORPUS_RETRIES || 4 }}
      IRIS_PREVIEW_CORPUS_RETRY_DELAY_SECONDS: ${{ vars.IRIS_PREVIEW_CORPUS_RETRY_DELAY_SECONDS || 2 }}
      IRIS_PREVIEW_CORPUS_MAX_RETRY_DELAY_SECONDS: ${{ vars.IRIS_PREVIEW_CORPUS_MAX_RETRY_DELAY_SECONDS || 30 }}
      IRIS_PREVIEW_LATENCY_WARMUPS: ${{ vars.IRIS_PREVIEW_LATENCY_WARMUPS || 2 }}
      IRIS_PREVIEW_LATENCY_SAMPLES: ${{ vars.IRIS_PREVIEW_LATENCY_SAMPLES || 21 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch pinned baseline commit for paired parity
        shell: bash
        run: |
          git fetch origin refs/heads/main
          git cat-file -e 8e55c491f27b3cb9ca7c7245610812d3e7dcb5cc^{commit}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Checkout pinned vcpkg source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: microsoft/vcpkg
          ref: b8dfe957ec8b5c0ef5c4b31eea594b8486af744f
          path: .vcpkg-validation
          fetch-depth: 0
          persist-credentials: false
      - name: Assert pinned vcpkg HEAD and baseline port
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vcpkgRoot = $env:VCPKG_ROOT
          $head = ((git -C $vcpkgRoot rev-parse HEAD) | Out-String).Trim()
          Write-Host "vcpkg HEAD: $head"
          if ($head -ne "b8dfe957ec8b5c0ef5c4b31eea594b8486af744f") {
            throw "vcpkg HEAD $head != pinned baseline; refusing to build"
          }
          git -C $vcpkgRoot diff --exit-code $head -- ports/ffmpeg scripts/cmake/vcpkg_from_github.cmake
          if ($LASTEXITCODE -ne 0) { throw "baseline FFmpeg port/helper has local changes" }
      - name: Bootstrap pinned vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = $env:VCPKG_ROOT
          & (Join-Path $root "bootstrap-vcpkg.bat")
          if ($LASTEXITCODE -ne 0) { throw "vcpkg bootstrap failed" }
          & (Join-Path $root "vcpkg.exe") --version
          if ($LASTEXITCODE -ne 0) { throw "vcpkg --version failed" }
      - name: Set up MSVC developer environment (x64)
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - name: Restore isolated vcpkg root after MSVC setup
        shell: pwsh
        run: |
          "VCPKG_ROOT=$env:VCPKG_ROOT" >> $env:GITHUB_ENV
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: parity-windows-cargo
      - name: Acquire and stage verified FFmpeg source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pin = python3 scripts/windows-ffmpeg-source.py plan | ConvertFrom-Json
          if ($pin.version -ne "8.1.3") { throw "unapproved FFmpeg version" }
          $dest = $env:IRIS_VALIDATION_SOURCE
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $gpgDir = "build/validation/gpg"
          New-Item -ItemType Directory -Force -Path $gpgDir | Out-Null
          $archive = Join-Path $env:RUNNER_TEMP "ffmpeg-8.1.3.tar.xz"
          $asc = Join-Path $env:RUNNER_TEMP "ffmpeg-8.1.3.tar.xz.asc"
          $gpgArchive = "$gpgDir/ffmpeg-8.1.3.tar.xz"
          $gpgAsc = "$gpgDir/ffmpeg-8.1.3.tar.xz.asc"
          $key = "$gpgDir/ffmpeg-key.asc"
          $gpgHome = "$gpgDir/home"
          New-Item -ItemType Directory -Force -Path $gpgHome | Out-Null
          Invoke-WebRequest -Uri $pin.url -OutFile $archive -UseBasicParsing
          Invoke-WebRequest -Uri $pin.signature_url -OutFile $asc -UseBasicParsing
          Invoke-WebRequest -Uri $pin.key_url -OutFile $key -UseBasicParsing
          Copy-Item -LiteralPath $archive -Destination $gpgArchive -Force
          Copy-Item -LiteralPath $asc -Destination $gpgAsc -Force
          $status = "$gpgDir/status.txt"
          & gpg --homedir $gpgHome --batch --import $key
          if ($LASTEXITCODE -ne 0) { throw "FFmpeg signing key import failed" }
          & gpg --homedir $gpgHome --batch --status-file $status --verify $gpgAsc $gpgArchive
          if ($LASTEXITCODE -ne 0) { throw "FFmpeg signature verification failed" }
          python3 scripts/windows-ffmpeg-source.py stage $archive $status $dest
          if ($LASTEXITCODE -ne 0) { throw "FFmpeg source staging failed" }
      - name: Derive local-source vcpkg overlay
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sourceDir = Join-Path $env:IRIS_VALIDATION_SOURCE "ffmpeg-8.1.3"
          if (!(Test-Path -LiteralPath (Join-Path $sourceDir "configure") -PathType Leaf)) { throw "staged FFmpeg source missing configure; layout drifted" }
          if (!(Test-Path -LiteralPath (Join-Path $sourceDir "RELEASE") -PathType Leaf)) { throw "staged FFmpeg source missing RELEASE; layout drifted" }
          $overlay = $env:IRIS_VALIDATION_OVERLAY
          $portDir = Join-Path $overlay "ffmpeg"
          if (Test-Path -LiteralPath $portDir) { Remove-Item -Recurse -Force -LiteralPath $portDir }
          New-Item -ItemType Directory -Force -Path $portDir | Out-Null
          Copy-Item -Recurse -Force -Path (Join-Path $env:VCPKG_ROOT "ports/ffmpeg/*") -Destination $portDir
          $portfile = Join-Path $env:VCPKG_ROOT "ports/ffmpeg/portfile.cmake"
          python3 scripts/windows-ffmpeg-overlay.py derive $portfile $sourceDir (Join-Path $portDir "portfile.cmake")
          if ($LASTEXITCODE -ne 0) { throw "vcpkg overlay derivation failed" }
      - name: Install FFmpeg via pinned vcpkg with verified overlay
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $manifestRoot = Join-Path $env:GITHUB_WORKSPACE "packaging/windows/validation"
          $installRoot = Join-Path $env:VCPKG_ROOT "installed"
          $tripletDir = Join-Path $env:GITHUB_WORKSPACE "packaging/windows/validation/triplets"
          if (@($manifestRoot, $installRoot, $tripletDir, $env:IRIS_VALIDATION_OVERLAY).Where({ [string]::IsNullOrWhiteSpace($_) }).Count -gt 0) { throw "empty vcpkg path" }
          $env:VCPKG_OVERLAY_PORTS = $env:IRIS_VALIDATION_OVERLAY
          $env:VCPKG_OVERLAY_TRIPLETS = $tripletDir
          & (Join-Path $env:VCPKG_ROOT "vcpkg.exe") install --x-manifest-root=$manifestRoot --x-install-root=$installRoot --triplet=x64-windows-iris-dynamic
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed" }
          $binDir = Join-Path $env:VCPKG_INSTALLED_DIR "x64-windows-iris-dynamic/bin"
          if (!(Test-Path -LiteralPath $binDir)) { throw "vcpkg FFmpeg DLL bin dir missing: $binDir" }
          $dlls = @(Get-ChildItem -LiteralPath $binDir -Filter "*.dll" -File)
          if ($dlls.Count -lt 2) { throw "vcpkg DLL closure missing in $binDir" }
      - name: Acquire attested PDFium runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $pin = python3 scripts/windows-ffmpeg-source.py pdfium | ConvertFrom-Json
          if ($pin.release -ne "chromium/8138") { throw "unapproved PDFium release" }
          if ($pin.attestation_required -ne $true) { throw "PDFium attestation not required" }
          $asset = Join-Path $env:RUNNER_TEMP $pin.asset
          Invoke-WebRequest -Uri $pin.url -OutFile "$asset.part" -UseBasicParsing
          if ((Get-Item -LiteralPath "$asset.part").Length -ne $pin.bytes) { throw "PDFium size mismatch" }
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath "$asset.part").Hash.ToLowerInvariant() -ne $pin.sha256) { throw "PDFium sha256 mismatch" }
          Move-Item -Force -LiteralPath "$asset.part" -Destination $asset
          if ($pin.attestation_asset -ne "pdfium-attestation.json") { throw "unapproved PDFium attestation bundle" }
          if ($pin.attestation_bytes -ne 18267) { throw "unapproved PDFium attestation bundle size" }
          if ($pin.attestation_sha256 -ne "7526f4b934ab498d6206ac7f3d78dd4ce8e0f7d3175227ab3f4ecc255d950ad7") { throw "unapproved PDFium attestation bundle sha256" }
          $bundle = Join-Path $env:RUNNER_TEMP $pin.attestation_asset
          $bundleUrl = "https://github.com/$($pin.repo)/releases/download/$($pin.release)/$($pin.attestation_asset)"
          Invoke-WebRequest -Uri $bundleUrl -OutFile "$bundle.part" -UseBasicParsing
          if ((Get-Item -LiteralPath "$bundle.part").Length -ne $pin.attestation_bytes) { throw "PDFium attestation bundle size mismatch" }
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath "$bundle.part").Hash.ToLowerInvariant() -ne $pin.attestation_sha256) { throw "PDFium attestation bundle sha256 mismatch" }
          Move-Item -Force -LiteralPath "$bundle.part" -Destination $bundle
          gh attestation verify $asset --repo $pin.repo --bundle $bundle --signer-workflow $pin.signer_workflow --signer-digest $pin.signer_digest --source-digest $pin.source_digest --source-ref $pin.source_ref
          if ($LASTEXITCODE -ne 0) { throw "PDFium release attestation verification failed" }
          $extract = Join-Path $env:RUNNER_TEMP "pdfium-extract"
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          tar -xzf $asset -C $extract
          if ($LASTEXITCODE -ne 0) { throw "PDFium extraction failed" }
          $runtime = Join-Path $env:RUNNER_TEMP "pdfium-runtime"
          New-Item -ItemType Directory -Force -Path $runtime | Out-Null
          $members = @(tar -tzf $asset | ForEach-Object { $_.Trim() } | Where-Object { $_ } | Sort-Object -Unique)
          $dllMembers = @($members | Where-Object { $_ -eq "bin/pdfium.dll" -or $_ -eq "pdfium.dll" })
          if ($dllMembers.Count -eq 0) { throw "PDFium DLL member absent" }
          foreach ($m in $dllMembers) {
            Copy-Item -LiteralPath (Join-Path $extract ($m -replace "/", [IO.Path]::DirectorySeparatorChar)) -Destination (Join-Path $runtime "pdfium.dll") -Force
          }
          if (!(Test-Path -LiteralPath (Join-Path $runtime "pdfium.dll") -PathType Leaf)) { throw "attested PDFium DLL missing" }
          "IRIS_VALIDATION_PDFIUM_RUNTIME=$runtime" >> $env:GITHUB_ENV
      - name: Expose validated native DLLs for parity smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:IRIS_VALIDATION_PDFIUM_RUNTIME)) { throw "attested PDFium runtime not bound" }
          $pdfium = Join-Path $env:IRIS_VALIDATION_PDFIUM_RUNTIME "pdfium.dll"
          if (!(Test-Path -LiteralPath $pdfium -PathType Leaf)) { throw "attested PDFium DLL missing: $pdfium" }
          $dllDir = Join-Path $env:VCPKG_INSTALLED_DIR "$env:IRIS_VALIDATION_TRIPLET/bin"
          if (!(Test-Path -LiteralPath $dllDir -PathType Container)) { throw "vcpkg DLL directory missing: $dllDir" }
          Copy-Item -LiteralPath $pdfium -Destination (Join-Path $dllDir "pdfium.dll") -Force
          "$dllDir" >> $env:GITHUB_PATH
      - name: Fetch locked Rust inputs before offline parity runs
        shell: pwsh
        run: |
          cargo fetch --locked
          if ($LASTEXITCODE -ne 0) { throw "cargo fetch failed" }
      - name: Fetch preview corpus bytes
        shell: bash
        run: python3 scripts/fetch-preview-corpus.py --output "$RUNNER_TEMP/iris-preview-corpus"
      - name: Apply product build profile to Windows parity smoke
        shell: pwsh
        run: |
          $profile = (& python3 scripts/product_build_profile.py --platform windows | Out-String).Trim()
          "CARGO_PROFILE_RELEASE_OPT_LEVEL=$profile" >> $env:GITHUB_ENV
      - name: Produce Windows paired-source parity report
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: python3 scripts/parity_source_compare.py --repo . --candidate "$SOURCE_SHA" --corpus "$RUNNER_TEMP/iris-preview-corpus" --pdfium-library "$IRIS_VALIDATION_PDFIUM_RUNTIME/pdfium.dll" --output audit/parity/windows.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: parity-windows
          path: audit/parity/windows.json
          if-no-files-found: error
