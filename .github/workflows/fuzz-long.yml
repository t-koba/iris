name: Long Fuzz

on:
  workflow_dispatch:
  schedule:
    - cron: "43 16 * * 5"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        target:
          - raw_tiff_parse
          - raw_bmff
          - image_sniff
          - raw_cr3_box
          - raw_x3f_parse
          - config_load
          - remote_transport_mount_table
          - segment_parse
          - ngram_normalize
          - filter_token_parse
          - smb_transform_parse
          - smb_ntlmssp_parse
          - smb_directory_parse

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: nightly-2026-07-11

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: long-fuzz-${{ matrix.target }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config clang ffmpeg \
            libavcodec-dev libavformat-dev libavutil-dev libavfilter-dev \
            libavdevice-dev libswscale-dev libswresample-dev

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2
        with:
          tool: cargo-fuzz

      - name: Run long fuzz target
        env:
          # Match the ci.yml fuzz smoke: the installed cargo-fuzz binary may
          # infer a musl target that cannot link ASan on the runner.
          IRIS_FUZZ_TARGET: x86_64-unknown-linux-gnu
        run: FUZZ_MAX_TOTAL_TIME=3600 ./scripts/fuzz-target.sh "${{ matrix.target }}"

      - name: Upload fuzz artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: |
            crates/*/fuzz/artifacts/${{ matrix.target }}
            crates/*/fuzz/corpus/${{ matrix.target }}
          if-no-files-found: ignore
