name: Release

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Source branch, tag or commit to audit (never publishes)"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  IRIS_SNAPSHOT_UPDATE: "0"
  INSTA_UPDATE: no
  IRIS_MACOS_DEPLOYMENT_TARGET: "14.0"
  MACOSX_DEPLOYMENT_TARGET: "14.0"
  IRIS_RELEASE_AUDIT_MAX_REPORT_BYTES: ${{ vars.IRIS_RELEASE_AUDIT_MAX_REPORT_BYTES || 2097152 }}
  IRIS_RELEASE_AUDIT_MAX_COMMAND_BYTES: ${{ vars.IRIS_RELEASE_AUDIT_MAX_COMMAND_BYTES || 32768 }}
  IRIS_RELEASE_AUDIT_MAX_NATIVE_FILES: ${{ vars.IRIS_RELEASE_AUDIT_MAX_NATIVE_FILES || 256 }}
  IRIS_RELEASE_AUDIT_COMMAND_SECONDS: ${{ vars.IRIS_RELEASE_AUDIT_COMMAND_SECONDS || 30 }}

jobs:
  release-preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Validate release audit contract
        run: python scripts/test-release-audit.py

      - name: Resolve package source and workspace version
        id: source
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          version="$(sed -n '/^\[workspace.package\]$/,/^\[/{s/^version = "\([^" ]*\)".*/\1/p;}' Cargo.toml | head -n 1)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify tag commit belongs to main
        if: github.event_name == 'push'
        shell: bash
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "release tags must point to a commit reachable from main" >&2
            exit 1
          fi

      - name: Check tag matches crate version
        if: github.event_name == 'push'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_NAME" != "v$version" || -z "$version" ]]; then
            echo "release workflow must run from a v* tag" >&2
            exit 1
          fi
          workspace_version="$(sed -n '/^\[workspace.package\]$/,/^\[/{s/^version = "\([^" ]*\)".*/\1/p;}' Cargo.toml | head -n 1)"
          if [[ "$workspace_version" != "$version" ]]; then
            echo "tag $GITHUB_REF_NAME does not match workspace version $workspace_version" >&2
            exit 1
          fi

  package-macos:
    needs: release-preflight
    env:
      IRIS_RELEASE_VERSION: ${{ needs.release-preflight.outputs.version }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-preflight.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-macos-cargo
      - name: Install system dependencies
        run: brew install ffmpeg pkg-config
      - name: Package macOS app
        env:
          IRIS_MACOS_SIGN_IDENTITY: ${{ github.event_name == 'push' && secrets.IRIS_MACOS_SIGN_IDENTITY || '-' }}
          IRIS_MACOS_NOTARY_PROFILE: ${{ github.event_name == 'push' && secrets.IRIS_MACOS_NOTARY_PROFILE || '' }}
          IRIS_MACOS_DEPLOYMENT_TARGET: ${{ env.IRIS_MACOS_DEPLOYMENT_TARGET }}
        run: ./scripts/package-macos-app.sh
      - name: Verify macOS artifact
        run: |
          test -x dist/macos/Iris.app/Contents/MacOS/Iris
          plutil -extract CFBundleShortVersionString raw -o - dist/macos/Iris.app/Contents/Info.plist | grep -Fx "$IRIS_RELEASE_VERSION"
          zipinfo -1 dist/macos/Iris-macos.zip | grep -Fx "Iris.app/Contents/MacOS/Iris"
          codesign --verify --deep --strict --verbose=2 dist/macos/Iris.app
          pkgutil --payload-files dist/macos/Iris-macos.pkg > "$RUNNER_TEMP/iris-pkg-payload.txt"
          grep -E '(^|/)Iris\.app/Contents/MacOS/Iris$' "$RUNNER_TEMP/iris-pkg-payload.txt"
      - name: Generate macOS checksums
        run: |
          cd dist/macos
          for file in Iris-macos.zip Iris-macos.pkg; do
            shasum -a 256 "$file" > "$file.sha256"
            shasum -a 256 -c "$file.sha256"
          done
      - name: Stage macOS release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          if-no-files-found: error
          path: |
            dist/macos/Iris-macos.zip
            dist/macos/Iris-macos.zip.sha256
            dist/macos/Iris-macos.pkg
            dist/macos/Iris-macos.pkg.sha256

      - name: Audit staged macos runtime
        if: ${{ !cancelled() }}
        shell: bash
        run: python scripts/release-audit.py macos --output audit/macos.json
      - name: Retain macos audit evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: audit-macos
          if-no-files-found: error
          path: audit/macos.json

  package-linux:
    needs: release-preflight
    env:
      IRIS_RELEASE_VERSION: ${{ needs.release-preflight.outputs.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    outputs:
      deb-arch: ${{ steps.deb.outputs.arch }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-preflight.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-linux-cargo
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh pkg-config clang ffmpeg dpkg-dev \
            libavcodec-dev libavformat-dev libavutil-dev libavfilter-dev \
            libavdevice-dev libswscale-dev libswresample-dev
      - name: Package Linux AppDir for manual audit
        if: github.event_name == 'workflow_dispatch'
        env:
          IRIS_VERIFY_PDFIUM_PROVENANCE: "0"
        run: ./scripts/package-linux-appdir.sh
      - name: Package Linux AppDir for tagged release
        if: github.event_name == 'push'
        env:
          IRIS_VERIFY_PDFIUM_PROVENANCE: "1"
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/package-linux-appdir.sh
      - name: Build PDFium smoke test
        env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: s
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/package-linux
        run: cargo build --release -p iris-thumb-preview --example pdf_thumbnail_smoke --locked
      - name: Archive Linux AppDir
        run: tar -C dist/linux -czf dist/linux/Iris-linux-appdir.tar.gz Iris.AppDir
      - name: Verify Linux artifact
        run: |
          tar -tzf dist/linux/Iris-linux-appdir.tar.gz | grep -Fx "Iris.AppDir/AppRun"
          tar -tzf dist/linux/Iris-linux-appdir.tar.gz | grep -Fx "Iris.AppDir/usr/bin/Iris"
          tar -tzf dist/linux/Iris-linux-appdir.tar.gz | grep -Fx "Iris.AppDir/usr/share/applications/iris.desktop"
          tar -tzf dist/linux/Iris-linux-appdir.tar.gz | grep -Fx "Iris.AppDir/usr/lib/iris/libpdfium.so"
          tar -tzf dist/linux/Iris-linux-appdir.tar.gz | grep -Fx "Iris.AppDir/usr/share/doc/iris/pdfium/LICENSE"
          tar -tzf dist/linux/Iris-linux-appdir.tar.gz | grep -Fx "Iris.AppDir/usr/share/doc/iris/pdfium/licenses/pdfium.txt"
      - name: Verify Debian installer
        id: deb
        shell: bash
        run: |
          version="$IRIS_RELEASE_VERSION"
          arch="$(dpkg --print-architecture)"
          deb="dist/linux/iris_${version}_${arch}.deb"
          shopt -s nullglob
          packages=(dist/linux/*.deb)
          [[ ${#packages[@]} -eq 1 && "${packages[0]}" == "$deb" ]]
          [[ "$(dpkg-deb -f "$deb" Package)" == iris ]]
          [[ "$(dpkg-deb -f "$deb" Version)" == "$version" ]]
          [[ "$(dpkg-deb -f "$deb" Architecture)" == "$arch" ]]
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"
          dpkg-deb --contents "$deb" | grep -F 'usr/lib/iris/libpdfium.so'
          dpkg-deb --contents "$deb" | grep -F 'usr/share/doc/iris/pdfium/LICENSE'
          ./scripts/smoke-linux-deb.sh "$deb" dist/linux/Iris.AppDir \
            target/package-linux/release/examples/pdf_thumbnail_smoke
          echo "arch=$arch" >> "$GITHUB_OUTPUT"
      - name: Generate Linux checksums
        run: |
          cd dist/linux
          for file in Iris-linux-appdir.tar.gz iris_*.deb; do
            sha256sum "$file" > "$file.sha256"
            sha256sum -c "$file.sha256"
          done
      - name: Stage Linux release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          if-no-files-found: error
          path: |
            dist/linux/Iris-linux-appdir.tar.gz
            dist/linux/Iris-linux-appdir.tar.gz.sha256
            dist/linux/*.deb
            dist/linux/*.deb.sha256

      - name: Audit staged linux runtime
        if: ${{ !cancelled() }}
        shell: bash
        run: python scripts/release-audit.py linux --output audit/linux.json
      - name: Retain linux audit evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: audit-linux
          if-no-files-found: error
          path: audit/linux.json

  package-windows:
    needs: release-preflight
    env:
      IRIS_RELEASE_VERSION: ${{ needs.release-preflight.outputs.version }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-preflight.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-windows-cargo
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --version=6.7.1 --allow-downgrade --yes --no-progress
          if ($LASTEXITCODE -notin @(0, 3010)) { throw "Inno Setup installation failed" }
          exit 0
      - name: Package Windows app
        env:
          IRIS_BUILD_VARIANT: minimal
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Verify Windows artifact
        shell: pwsh
        run: |
          if (!(Test-Path "dist/windows/Iris/Iris.exe")) { throw "dist/windows/Iris/Iris.exe missing" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead("dist/windows/Iris-windows.zip")
          try {
            if (!($zip.Entries | Where-Object { $_.FullName -eq "Iris.exe" })) {
              throw "Iris.exe missing from dist/windows/Iris-windows.zip"
            }
          } finally {
            $zip.Dispose()
          }
      - name: Smoke-test Windows installer
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "Iris-install-smoke"
          $setup = (Resolve-Path "dist/windows/Iris-windows-setup.exe").Path
          $result = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=`"$installDir`"")
          if ($result.ExitCode -ne 0) { throw "Installer failed: $($result.ExitCode)" }
          try {
            $installed = Get-FileHash -Algorithm SHA256 (Join-Path $installDir "Iris.exe")
            $portable = Get-FileHash -Algorithm SHA256 "dist/windows/Iris/Iris.exe"
            if ($installed.Hash -ne $portable.Hash) { throw "Installed executable differs from portable executable" }
          } finally {
            $result = Start-Process -FilePath (Join-Path $installDir "unins000.exe") -Wait -PassThru -ArgumentList @(
              '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART')
            if ($result.ExitCode -ne 0) { throw "Uninstaller failed: $($result.ExitCode)" }
          }
          if (Test-Path (Join-Path $installDir "Iris.exe")) { throw "Uninstaller left Iris.exe behind" }
      - name: Generate Windows checksums
        shell: pwsh
        run: |
          Push-Location dist/windows
          try {
            foreach ($file in @("Iris-windows.zip", "Iris-windows-setup.exe")) {
              $hash = Get-FileHash -Algorithm SHA256 $file
              "$($hash.Hash.ToLowerInvariant())  $file" | Out-File -Encoding ascii "$file.sha256"
              $expected = (Get-Content "$file.sha256").Split(" ")[0]
              $actual = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant()
              if ($actual -ne $expected) { throw "checksum verification failed: $file" }
            }
          } finally {
            Pop-Location
          }
      - name: Stage Windows release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          if-no-files-found: error
          path: |
            dist/windows/Iris-windows.zip
            dist/windows/Iris-windows.zip.sha256
            dist/windows/Iris-windows-setup.exe
            dist/windows/Iris-windows-setup.exe.sha256

      - name: Audit staged windows runtime
        if: ${{ !cancelled() }}
        shell: bash
        run: python scripts/release-audit.py windows --output audit/windows.json
      - name: Retain windows audit evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: audit-windows
          if-no-files-found: error
          path: audit/windows.json

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [package-macos, package-linux, package-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download staged release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist/release
      - name: Verify complete release set
        shell: bash
        env:
          DEB_ARCH: ${{ needs.package-linux.outputs.deb-arch }}
        run: |
          cd dist/release
          payloads=(
            Iris-macos.zip
            Iris-macos.pkg
            Iris-linux-appdir.tar.gz
            "iris_${GITHUB_REF_NAME#v}_${DEB_ARCH}.deb"
            Iris-windows.zip
            Iris-windows-setup.exe
          )
          for file in "${payloads[@]}"; do
            printf '%s\n' "$file" "$file.sha256"
          done | sort > "$RUNNER_TEMP/expected-release-files"
          find . -mindepth 1 -printf '%P\n' | sort > "$RUNNER_TEMP/actual-release-files"
          diff -u "$RUNNER_TEMP/expected-release-files" "$RUNNER_TEMP/actual-release-files"
          for file in "${payloads[@]}"; do
            test -s "$file"
            sha256sum -c "$file.sha256"
          done
      - name: Publish complete release
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          files: dist/release/*
