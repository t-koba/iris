name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  IRIS_SNAPSHOT_UPDATE: "0"
  INSTA_UPDATE: no
  IRIS_MACOS_DEPLOYMENT_TARGET: "14.0"
  MACOSX_DEPLOYMENT_TARGET: "14.0"
  IRIS_RELEASE_AUDIT_MAX_REPORT_BYTES: ${{ vars.IRIS_RELEASE_AUDIT_MAX_REPORT_BYTES || 2097152 }}
  IRIS_RELEASE_POLICY_MAX_BYTES: ${{ vars.IRIS_RELEASE_POLICY_MAX_BYTES || 65536 }}
  IRIS_RELEASE_AUDIT_MAX_COMMAND_BYTES: ${{ vars.IRIS_RELEASE_AUDIT_MAX_COMMAND_BYTES || 32768 }}
  IRIS_RELEASE_AUDIT_MAX_METADATA_BYTES: ${{ vars.IRIS_RELEASE_AUDIT_MAX_METADATA_BYTES || 8388608 }}
  IRIS_RELEASE_AUDIT_MAX_CARGO_PACKAGES: ${{ vars.IRIS_RELEASE_AUDIT_MAX_CARGO_PACKAGES || 1024 }}
  IRIS_RELEASE_AUDIT_MAX_NATIVE_FILES: ${{ vars.IRIS_RELEASE_AUDIT_MAX_NATIVE_FILES || 256 }}
  IRIS_RELEASE_AUDIT_MAX_NATIVE_COMPONENTS: ${{ vars.IRIS_RELEASE_AUDIT_MAX_NATIVE_COMPONENTS || 4096 }}
  IRIS_RELEASE_AUDIT_COMMAND_SECONDS: ${{ vars.IRIS_RELEASE_AUDIT_COMMAND_SECONDS || 30 }}

jobs:
  release-preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Validate release audit contract
        run: python scripts/test-release-audit.py
      - name: Validate release policy gate offline
        timeout-minutes: 1
        run: python scripts/test-release-policy.py
      - name: Validate release parity gate offline
        timeout-minutes: 1
        run: python scripts/test-release-parity.py
      - name: Validate POSIX native-evidence producer offline
        timeout-minutes: 1
        run: python scripts/test-posix-native-evidence.py
      - name: Validate macOS installer trust gate offline
        timeout-minutes: 1
        run: python3 scripts/test-macos-installer-trust.py
      - name: Validate macOS signing credential provisioning offline
        timeout-minutes: 1
        run: python3 scripts/test-macos-signing-provision.py

      - name: Resolve package source and workspace version
        id: source
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          version="$(sed -n '/^\[workspace.package\]$/,/^\[/{s/^version = "\([^" ]*\)".*/\1/p;}' Cargo.toml | head -n 1)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify tag commit belongs to main
        if: github.event_name == 'push'
        shell: bash
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "release tags must point to a commit reachable from main" >&2
            exit 1
          fi

      - name: Check tag matches crate version
        if: github.event_name == 'push'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_NAME" != "v$version" || -z "$version" ]]; then
            echo "release workflow must run from a v* tag" >&2
            exit 1
          fi
          workspace_version="$(sed -n '/^\[workspace.package\]$/,/^\[/{s/^version = "\([^" ]*\)".*/\1/p;}' Cargo.toml | head -n 1)"
          if [[ "$workspace_version" != "$version" ]]; then
            echo "tag $GITHUB_REF_NAME does not match workspace version $workspace_version" >&2
            exit 1
          fi

  parity-evidence:
    if: github.event_name == 'push'
    needs: release-preflight
    permissions:
      contents: read
    uses: ./.github/workflows/parity-evidence.yml
    with:
      source_sha: ${{ needs.release-preflight.outputs.source_sha }}

  package-macos:
    needs: release-preflight
    env:
      IRIS_RELEASE_VERSION: ${{ needs.release-preflight.outputs.version }}
      IRIS_FFMPEG_JOBS: ${{ vars.IRIS_FFMPEG_JOBS || 2 }}
      IRIS_FFMPEG_BUILD_SECONDS: ${{ vars.IRIS_FFMPEG_BUILD_SECONDS || 3600 }}
      IRIS_FFMPEG_FETCH_SECONDS: ${{ vars.IRIS_FFMPEG_FETCH_SECONDS || 300 }}
      IRIS_FFMPEG_FETCH_RETRIES: ${{ vars.IRIS_FFMPEG_FETCH_RETRIES || 1 }}
      IRIS_FFMPEG_FETCH_RETRY_DELAY_SECONDS: ${{ vars.IRIS_FFMPEG_FETCH_RETRY_DELAY_SECONDS || 2 }}
      IRIS_FFMPEG_COMMAND_SECONDS: ${{ vars.IRIS_FFMPEG_COMMAND_SECONDS || 60 }}
      IRIS_FFMPEG_COMMAND_BYTES: ${{ vars.IRIS_FFMPEG_COMMAND_BYTES || 32768 }}
      IRIS_FFMPEG_MAX_NATIVE_FILES: ${{ vars.IRIS_FFMPEG_MAX_NATIVE_FILES || 256 }}
      IRIS_FFMPEG_MAX_REPORT_BYTES: ${{ vars.IRIS_FFMPEG_MAX_REPORT_BYTES || 266240 }}
      IRIS_PREVIEW_CORPUS_MAX_BYTES: ${{ vars.IRIS_PREVIEW_CORPUS_MAX_BYTES || 40000000 }}
      IRIS_PREVIEW_CORPUS_TIMEOUT_SECONDS: ${{ vars.IRIS_PREVIEW_CORPUS_TIMEOUT_SECONDS || 60 }}
      IRIS_PREVIEW_CORPUS_RETRIES: ${{ vars.IRIS_PREVIEW_CORPUS_RETRIES || 1 }}
      IRIS_PREVIEW_CORPUS_RETRY_DELAY_SECONDS: ${{ vars.IRIS_PREVIEW_CORPUS_RETRY_DELAY_SECONDS || 2 }}
      IRIS_PREVIEW_LATENCY_WARMUPS: ${{ vars.IRIS_PREVIEW_LATENCY_WARMUPS || 2 }}
      IRIS_PREVIEW_LATENCY_SAMPLES: ${{ vars.IRIS_PREVIEW_LATENCY_SAMPLES || 21 }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-preflight.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: release-macos-cargo
          cache-targets: false
      - name: Install system dependencies
        run: brew install pkg-config gnupg nasm cmake
      - name: Fetch locked Rust inputs before offline packaging
        run: cargo fetch --locked
      - name: Validate pinned macOS runtime contracts
        run: python3 scripts/test-macos-ffmpeg.py
      - name: Provision macOS signing credentials
        if: github.event_name == 'push'
        env:
          IRIS_MACOS_SIGN_IDENTITY: ${{ secrets.IRIS_MACOS_SIGN_IDENTITY }}
          IRIS_MACOS_INSTALLER_IDENTITY: ${{ secrets.IRIS_MACOS_INSTALLER_IDENTITY }}
          IRIS_MACOS_NOTARY_PROFILE: ${{ secrets.IRIS_MACOS_NOTARY_PROFILE }}
          IRIS_MACOS_INSTALLER_NOTARY_PROFILE: ${{ secrets.IRIS_MACOS_INSTALLER_NOTARY_PROFILE }}
          IRIS_MACOS_SIGNING_P12_BASE64: ${{ secrets.IRIS_MACOS_SIGNING_P12_BASE64 }}
          IRIS_MACOS_SIGNING_P12_PASSWORD: ${{ secrets.IRIS_MACOS_SIGNING_P12_PASSWORD }}
          IRIS_MACOS_KEYCHAIN_PASSWORD: ${{ secrets.IRIS_MACOS_KEYCHAIN_PASSWORD }}
          IRIS_MACOS_APPLE_ID: ${{ secrets.IRIS_MACOS_APPLE_ID }}
          IRIS_MACOS_TEAM_ID: ${{ secrets.IRIS_MACOS_TEAM_ID }}
          IRIS_MACOS_APP_PASSWORD: ${{ secrets.IRIS_MACOS_APP_PASSWORD }}
          IRIS_MACOS_KEYCHAIN_PATH: ${{ runner.temp }}/iris-signing.keychain-db
        run: python3 scripts/macos-signing-provision.py
      - name: Package macOS app
        env:
          IRIS_MACOS_KEYCHAIN_PATH: ${{ runner.temp }}/iris-signing.keychain-db
          IRIS_MACOS_SIGN_IDENTITY: ${{ github.event_name == 'push' && secrets.IRIS_MACOS_SIGN_IDENTITY || '-' }}
          IRIS_MACOS_NOTARY_PROFILE: ${{ github.event_name == 'push' && secrets.IRIS_MACOS_NOTARY_PROFILE || '' }}
          IRIS_MACOS_INSTALLER_IDENTITY: ${{ github.event_name == 'push' && secrets.IRIS_MACOS_INSTALLER_IDENTITY || '' }}
          IRIS_MACOS_INSTALLER_NOTARY_PROFILE: ${{ github.event_name == 'push' && secrets.IRIS_MACOS_INSTALLER_NOTARY_PROFILE || '' }}
          IRIS_MACOS_DEPLOYMENT_TARGET: ${{ env.IRIS_MACOS_DEPLOYMENT_TARGET }}
        run: ./scripts/package-macos-app.sh
      - name: Verify macOS artifact
        run: |
          test -x dist/macos/Iris.app/Contents/MacOS/Iris
          test -s dist/macos/Iris.app/Contents/Resources/ffmpeg-runtime.json
          test -s dist/macos/Iris.app/Contents/Resources/ffmpeg/source.tar.xz
          test -s dist/macos/Iris.app/Contents/Resources/ffmpeg/xz-source.tar.xz
          python3 scripts/macos-ffmpeg.py check dist/macos/Iris.app
          plutil -extract CFBundleShortVersionString raw -o - dist/macos/Iris.app/Contents/Info.plist | grep -Fx "$IRIS_RELEASE_VERSION"
          zipinfo -1 dist/macos/Iris-macos.zip | grep -Fx "Iris.app/Contents/MacOS/Iris"
          codesign --verify --deep --strict --verbose=2 dist/macos/Iris.app
          pkgutil --payload-files dist/macos/Iris-macos.pkg > "$RUNNER_TEMP/iris-pkg-payload.txt"
          grep -E '(^|/)Iris\.app/Contents/MacOS/Iris$' "$RUNNER_TEMP/iris-pkg-payload.txt"
      - name: Verify final macOS installer trust
        if: ${{ github.event_name == 'push' }}
        run: python3 scripts/macos-installer-trust.py verify --pkg dist/macos/Iris-macos.pkg --output audit/macos-installer-trust.json
      - name: Generate macOS checksums
        run: |
          cd dist/macos
          for file in Iris-macos.zip Iris-macos.pkg; do
            shasum -a 256 "$file" > "$file.sha256"
            shasum -a 256 -c "$file.sha256"
          done
      - name: Stage macOS release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-macos
          if-no-files-found: error
          path: |
            dist/macos/Iris-macos.zip
            dist/macos/Iris-macos.zip.sha256
            dist/macos/Iris-macos.pkg
            dist/macos/Iris-macos.pkg.sha256

      - name: Generate reviewed macOS native evidence
        shell: bash
        run: |
          python3 scripts/posix-native-evidence.py generate \
            --platform macos \
            --stage dist/macos \
            --mapping packaging/native-evidence/macos-mapping.json \
            --output audit/native-evidence/macos.json \
            --report audit/native-evidence/macos-review.json
      - name: Audit staged macos runtime
        if: ${{ !cancelled() }}
        shell: bash
        run: python scripts/release-audit.py macos --output audit/macos.json --native-evidence audit/native-evidence/macos.json --require-native-evidence
      - name: Retain macos audit evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: audit-macos
          if-no-files-found: error
          path: |
            audit/macos.json
            audit/macos-installer-trust.json
            audit/native-evidence/macos.json
            audit/native-evidence/macos-review.json

  package-linux:
    needs: release-preflight
    env:
      IRIS_RELEASE_VERSION: ${{ needs.release-preflight.outputs.version }}
      IRIS_FFMPEG_FETCH_SECONDS: ${{ vars.IRIS_FFMPEG_FETCH_SECONDS || 300 }}
      IRIS_FFMPEG_FETCH_RETRIES: ${{ vars.IRIS_FFMPEG_FETCH_RETRIES || 1 }}
      IRIS_FFMPEG_FETCH_RETRY_DELAY_SECONDS: ${{ vars.IRIS_FFMPEG_FETCH_RETRY_DELAY_SECONDS || 2 }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    outputs:
      deb-arch: ${{ steps.deb.outputs.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-preflight.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: release-linux-cargo
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh pkg-config clang dpkg-dev build-essential nasm patchelf curl gnupg zlib1g-dev libbz2-dev liblzma-dev
      - name: Fetch locked Rust inputs before offline packaging
        run: cargo fetch --locked
      - name: Package Linux AppDir for manual audit
        if: github.event_name == 'workflow_dispatch'
        env:
          IRIS_VERIFY_PDFIUM_PROVENANCE: "0"
          IRIS_PDFIUM_FETCH_RETRIES: ${{ vars.IRIS_PDFIUM_FETCH_RETRIES || 3 }}
          IRIS_PDFIUM_FETCH_RETRY_DELAY_SECONDS: ${{ vars.IRIS_PDFIUM_FETCH_RETRY_DELAY_SECONDS || 2 }}
        run: ./scripts/package-linux-appdir.sh
      - name: Package Linux AppDir for tagged release
        if: github.event_name == 'push'
        env:
          IRIS_VERIFY_PDFIUM_PROVENANCE: "1"
          GH_TOKEN: ${{ github.token }}
          IRIS_PDFIUM_FETCH_RETRIES: ${{ vars.IRIS_PDFIUM_FETCH_RETRIES || 3 }}
          IRIS_PDFIUM_FETCH_RETRY_DELAY_SECONDS: ${{ vars.IRIS_PDFIUM_FETCH_RETRY_DELAY_SECONDS || 2 }}
        run: ./scripts/package-linux-appdir.sh
      - name: Build Linux thumbnail smokes
        env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: s
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/package-linux
          FFMPEG_DIR: ${{ github.workspace }}/build/linux-ffmpeg
          PKG_CONFIG_LIBDIR: ${{ github.workspace }}/build/linux-ffmpeg/lib/pkgconfig
          PKG_CONFIG_PATH: ${{ github.workspace }}/build/linux-ffmpeg/lib/pkgconfig
        run: cargo build --release -p iris-thumb-preview --example pdf_thumbnail_smoke --example video_thumbnail_smoke --locked --offline
      - name: Archive Linux AppDir
        run: tar -C dist/linux -czf dist/linux/Iris-linux-appdir.tar.gz Iris.AppDir
      - name: Verify Linux artifact
        run: |
          tar -tzf dist/linux/Iris-linux-appdir.tar.gz | grep -Fx "Iris.AppDir/AppRun"
          tar -tzf dist/linux/Iris-linux-appdir.tar.gz | grep -Fx "Iris.AppDir/usr/bin/Iris"
          tar -tzf dist/linux/Iris-linux-appdir.tar.gz | grep -Fx "Iris.AppDir/usr/share/applications/iris.desktop"
          tar -tzf dist/linux/Iris-linux-appdir.tar.gz | grep -Fx "Iris.AppDir/usr/lib/iris/libpdfium.so"
          tar -tzf dist/linux/Iris-linux-appdir.tar.gz | grep -Fx "Iris.AppDir/usr/share/doc/iris/pdfium/LICENSE"
          tar -tzf dist/linux/Iris-linux-appdir.tar.gz | grep -Fx "Iris.AppDir/usr/share/doc/iris/pdfium/licenses/pdfium.txt"
      - name: Verify Debian installer
        id: deb
        shell: bash
        env:
          IRIS_FFMPEG_PREFIX: ${{ github.workspace }}/build/linux-ffmpeg
        run: |
          version="$IRIS_RELEASE_VERSION"
          arch="$(dpkg --print-architecture)"
          deb="dist/linux/iris_${version}_${arch}.deb"
          shopt -s nullglob
          packages=(dist/linux/*.deb)
          [[ ${#packages[@]} -eq 1 && "${packages[0]}" == "$deb" ]]
          [[ "$(dpkg-deb -f "$deb" Package)" == iris ]]
          [[ "$(dpkg-deb -f "$deb" Version)" == "$version" ]]
          [[ "$(dpkg-deb -f "$deb" Architecture)" == "$arch" ]]
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"
          dpkg-deb --contents "$deb" | grep -F 'usr/lib/iris/libpdfium.so'
          dpkg-deb --contents "$deb" | grep -F 'usr/share/doc/iris/pdfium/LICENSE'
          LD_LIBRARY_PATH="$IRIS_FFMPEG_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
            "$IRIS_FFMPEG_PREFIX/bin/ffmpeg" \
            -nostdin -v error -f lavfi -i testsrc2=size=64x48:rate=4 -t 1 -c:v mpeg4 -an "$RUNNER_TEMP/iris-video.avi"
          ./scripts/smoke-linux-deb.sh "$deb" dist/linux/Iris.AppDir \
            target/package-linux/release/examples/pdf_thumbnail_smoke \
            target/package-linux/release/examples/video_thumbnail_smoke "$RUNNER_TEMP/iris-video.avi"
          echo "arch=$arch" >> "$GITHUB_OUTPUT"
      - name: Generate Linux checksums
        run: |
          cd dist/linux
          for file in Iris-linux-appdir.tar.gz iris_*.deb; do
            sha256sum "$file" > "$file.sha256"
            sha256sum -c "$file.sha256"
          done
      - name: Stage Linux release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-linux
          if-no-files-found: error
          path: |
            dist/linux/Iris-linux-appdir.tar.gz
            dist/linux/Iris-linux-appdir.tar.gz.sha256
            dist/linux/*.deb
            dist/linux/*.deb.sha256

      - name: Generate reviewed Linux native evidence
        shell: bash
        run: |
          python3 scripts/posix-native-evidence.py generate \
            --platform linux \
            --stage dist/linux \
            --mapping packaging/native-evidence/linux-mapping.json \
            --output audit/native-evidence/linux.json \
            --report audit/native-evidence/linux-review.json
      - name: Audit staged linux runtime
        if: ${{ !cancelled() }}
        shell: bash
        run: python scripts/release-audit.py linux --output audit/linux.json --native-evidence audit/native-evidence/linux.json --require-native-evidence
      - name: Retain linux audit evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: audit-linux
          if-no-files-found: error
          path: |
            audit/linux.json
            audit/native-evidence/linux.json
            audit/native-evidence/linux-review.json

  windows-product-assets:
    needs: release-preflight
    permissions:
      contents: read
      attestations: read
    uses: ./.github/workflows/windows-ffmpeg-validation.yml
    with:
      export_release_assets: true

  package-windows:
    needs: [release-preflight, windows-product-assets]
    env:
      IRIS_RELEASE_VERSION: ${{ needs.release-preflight.outputs.version }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-preflight.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Download verified Windows release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-release-assets
          path: verified/windows
      - name: Download reviewed Windows native evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-native-evidence
          path: verified/windows-native-evidence
      - name: Verify exported Windows release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = "verified/windows"
          $resultPath = Join-Path $root "release-package-result.json"
          if (!(Test-Path -LiteralPath $resultPath -PathType Leaf)) { throw "release package result missing" }
          $result = Get-Content -LiteralPath $resultPath -Raw | ConvertFrom-Json
          if ($result.status -ne "pass") { throw "release package result is not pass" }
          if ($result.zip_sha256 -notmatch '^[0-9a-f]{64}$') { throw "invalid release ZIP sha256" }
          if ($result.installer_sha256 -notmatch '^[0-9a-f]{64}$') { throw "invalid installer sha256" }
          $zipPath = Join-Path $root "Iris-windows.zip"
          $setupPath = Join-Path $root "Iris-windows-setup.exe"
          foreach ($asset in @(
              @{ path = $zipPath; hash = $result.zip_sha256 },
              @{ path = $setupPath; hash = $result.installer_sha256 })) {
            if (!(Test-Path -LiteralPath $asset.path -PathType Leaf)) { throw "release asset missing: $($asset.path)" }
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $asset.path).Hash.ToLowerInvariant()
            if ($actual -ne $asset.hash) { throw "release asset hash mismatch: $($asset.path)" }
          }
          $inventoryPath = Join-Path $root "product-inventory.json"
          if (!(Test-Path -LiteralPath $inventoryPath -PathType Leaf)) { throw "product inventory missing" }
          $inventory = Get-Content -LiteralPath $inventoryPath -Raw | ConvertFrom-Json
          if ($null -eq $inventory -or $null -eq $inventory.files) { throw "product inventory has no files" }
          $names = @($inventory.files | ForEach-Object { [string]$_.name })
          $entries = @($result.entries)
          if ($names.Count -eq 0 -or $names.Count -gt 256 -or $names.Count -ne $entries.Count) { throw "inventory/result entry count mismatch" }
          if (@(Compare-Object -ReferenceObject $names -DifferenceObject $entries -CaseSensitive).Count -ne 0) {
            throw "inventory and result entries differ"
          }
          foreach ($required in @("Iris.exe", "pdfium.dll", "FFMPEG-NOTICE.md")) {
            if ($names -notcontains $required) { throw "required product file missing: $required" }
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            $zipNames = @($archive.Entries | ForEach-Object { $_.FullName })
            if (@(Compare-Object -ReferenceObject $names -DifferenceObject $zipNames -CaseSensitive).Count -ne 0) {
              throw "ZIP entries differ from the verified product inventory"
            }
          } finally { $archive.Dispose() }
          if (Test-Path -LiteralPath "dist/windows") { Remove-Item -LiteralPath "dist/windows" -Recurse -Force }
          New-Item -ItemType Directory -Path "dist/windows/Iris" -Force | Out-Null
          Copy-Item -LiteralPath $zipPath -Destination "dist/windows/Iris-windows.zip" -Force
          Copy-Item -LiteralPath $setupPath -Destination "dist/windows/Iris-windows-setup.exe" -Force
          Expand-Archive -LiteralPath "dist/windows/Iris-windows.zip" -DestinationPath "dist/windows/Iris" -Force
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: release-windows-cargo
      - name: Fetch locked Rust inputs before offline audit
        run: cargo fetch --locked
      - name: Verify Windows artifact
        shell: pwsh
        run: |
          if (!(Test-Path "dist/windows/Iris/Iris.exe")) { throw "dist/windows/Iris/Iris.exe missing" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead("dist/windows/Iris-windows.zip")
          try {
            if (!($zip.Entries | Where-Object { $_.FullName -eq "Iris.exe" })) {
              throw "Iris.exe missing from dist/windows/Iris-windows.zip"
            }
          } finally {
            $zip.Dispose()
          }
      - name: Smoke-test Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installDir = Join-Path $env:RUNNER_TEMP "Iris-install-smoke"
          if (Test-Path -LiteralPath $installDir) { Remove-Item -LiteralPath $installDir -Recurse -Force }
          $setup = (Resolve-Path "dist/windows/Iris-windows-setup.exe").Path
          $resultPath = "verified/windows/release-package-result.json"
          $exported = Get-Content -LiteralPath $resultPath -Raw | ConvertFrom-Json
          if ($exported.status -ne "pass" -or $exported.installer_sha256 -notmatch '^[0-9a-f]{64}$') {
            throw "exported installer sha256 is missing or invalid"
          }
          $setupHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $setup).Hash.ToLowerInvariant()
          if ($setupHash -ne $exported.installer_sha256) { throw "setup does not match exported installer sha256" }
          $install = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=`"$installDir`"")
          if ($install.ExitCode -ne 0) { throw "Installer failed: $($install.ExitCode)" }
          try {
            # Compare the installed bytes, not the generated installer [Files] list.
            # The verifier re-binds the setup hash and records the bound result.
            python scripts/windows-installed-smoke.py verify `
              --install-dir "$installDir" `
              --inventory "verified/windows/product-inventory.json" `
              --result $resultPath `
              --setup "$setup" `
              --output audit/windows-installer-smoke.json
            if ($LASTEXITCODE -ne 0) { throw "installed payload does not match the verified product inventory" }
          } finally {
            $uninstall = Start-Process -FilePath (Join-Path $installDir "unins000.exe") -Wait -PassThru -ArgumentList @(
              '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART')
            if ($uninstall.ExitCode -ne 0) { throw "Uninstaller failed: $($uninstall.ExitCode)" }
          }
          if (Test-Path (Join-Path $installDir "Iris.exe")) { throw "Uninstaller left Iris.exe behind" }
      - name: Generate Windows checksums
        shell: pwsh
        run: |
          Push-Location dist/windows
          try {
            foreach ($file in @("Iris-windows.zip", "Iris-windows-setup.exe")) {
              $hash = Get-FileHash -Algorithm SHA256 $file
              "$($hash.Hash.ToLowerInvariant())  $file" | Out-File -Encoding ascii "$file.sha256"
              $expected = (Get-Content "$file.sha256").Split(" ")[0]
              $actual = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant()
              if ($actual -ne $expected) { throw "checksum verification failed: $file" }
            }
          } finally {
            Pop-Location
          }
      - name: Stage Windows release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows
          if-no-files-found: error
          path: |
            dist/windows/Iris-windows.zip
            dist/windows/Iris-windows.zip.sha256
            dist/windows/Iris-windows-setup.exe
            dist/windows/Iris-windows-setup.exe.sha256

      - name: Seal reviewed Windows native evidence
        shell: bash
        run: |
          python3 scripts/windows-native-evidence.py seal \
            --manifest verified/windows-native-evidence/windows-native-evidence.json \
            --evidence verified/windows-native-evidence \
            --assets verified/windows \
            --dist dist/windows \
            --product dist/windows/Iris \
            --output verified/windows-native-evidence/windows-native-closure.json

      - name: Audit staged windows runtime
        if: ${{ !cancelled() }}
        shell: bash
        run: python scripts/release-audit.py windows --output audit/windows.json --native-evidence verified/windows-native-evidence/windows-native-closure.json --require-native-evidence
      - name: Retain windows audit evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: audit-windows
          if-no-files-found: error
          path: |
            audit/windows.json
            audit/windows-installer-smoke.json

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [package-macos, package-linux, package-windows, parity-evidence]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Download macOS audit evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: audit-macos
          path: audit/macos
      - name: Download Linux audit evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: audit-linux
          path: audit/linux
      - name: Download Windows audit evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: audit-windows
          path: audit/windows
      - name: Download staged release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist/release
      - name: Download paired parity evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: parity-*
          merge-multiple: true
          path: audit/parity
      - name: Gate publication on paired parity evidence
        run: >-
          python3 scripts/release-parity.py
          --repo . --expected-sha "$GITHUB_SHA"
          audit/parity/linux.json audit/parity/macos.json audit/parity/windows.json
      - name: Gate publication on release policy (not legal approval)
        run: >-
          python scripts/release-policy.py
          audit/macos/macos.json audit/linux/linux.json audit/windows/windows.json
      - name: Gate publication on final macOS installer trust
        run: python3 scripts/macos-installer-trust.py check --pkg dist/release/Iris-macos.pkg --evidence audit/macos/macos-installer-trust.json
      - name: Verify complete release set
        shell: bash
        env:
          DEB_ARCH: ${{ needs.package-linux.outputs.deb-arch }}
        run: |
          cd dist/release
          payloads=(
            Iris-macos.zip
            Iris-macos.pkg
            Iris-linux-appdir.tar.gz
            "iris_${GITHUB_REF_NAME#v}_${DEB_ARCH}.deb"
            Iris-windows.zip
            Iris-windows-setup.exe
          )
          for file in "${payloads[@]}"; do
            printf '%s\n' "$file" "$file.sha256"
          done | sort > "$RUNNER_TEMP/expected-release-files"
          find . -mindepth 1 -printf '%P\n' | sort > "$RUNNER_TEMP/actual-release-files"
          diff -u "$RUNNER_TEMP/expected-release-files" "$RUNNER_TEMP/actual-release-files"
          for file in "${payloads[@]}"; do
            test -s "$file"
            sha256sum -c "$file.sha256"
          done
      - name: Publish complete release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          fail_on_unmatched_files: true
          files: dist/release/*
