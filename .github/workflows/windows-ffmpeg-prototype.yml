name: Windows FFmpeg prototype

# Reusable, non-publishing prototype for the Windows default-preview
# investigation. The registered CI workflow calls it only on workflow_dispatch,
# allowing exact-ref validation without registering another top-level workflow.
# Never publishes or touches release packaging.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  prototype:
    # Explicit Windows Server 2022 runner track (not windows-latest). The
    # hosted image behind windows-2022 can still change: assertions pin the
    # OS build and VS major and record exact observed tools for review; exact
    # image/tool minor pins require a measured runner result first.
    runs-on: windows-2022
    env:
      CARGO_TERM_COLOR: always
      # Keep a stable value that the MSVC setup action cannot overwrite.
      IRIS_PROTOTYPE_VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-prototype
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-prototype
      VCPKG_INSTALLED_DIR: ${{ github.workspace }}/.vcpkg-prototype/installed
      VCPKG_TARGET_TRIPLET: x64-windows-prototype-dynamic
      VCPKG_DEFAULT_TRIPLET: x64-windows-prototype-dynamic
      VCPKGRS_TRIPLET: x64-windows-prototype-dynamic
      VCPKGRS_DYNAMIC: "1"
      IRIS_PROTOTYPE_TRIPLET: x64-windows-prototype-dynamic
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check prototype overlay derivation (no native build)
        shell: pwsh
        run: ./prototype/windows-ffmpeg/test-overlay-derivation.ps1

      - name: Check installed-smoke evidence lifecycle (no native build)
        shell: pwsh
        run: ./prototype/windows-ffmpeg/test-installed-smoke-lifecycle.ps1

      - name: Check pinned FFmpeg dependency adaptation (offline, no native build)
        shell: pwsh
        run: python ./prototype/windows-ffmpeg/test-ffmpeg-dependency-patch.py

      - name: Check bounded prototype audit report (offline, no native build)
        shell: pwsh
        run: python ./prototype/windows-ffmpeg/test-prototype-audit-report.py

      - name: Test prototype binding override transaction
        shell: pwsh
        run: python ./prototype/windows-ffmpeg/test-prototype-binding-build.py

      - name: Check source bundle requirements (offline, no native build)
        shell: pwsh
        run: python ./prototype/windows-ffmpeg/test-source-bundle.py

      # Pinned vcpkg source checkout at the exact baseline from pins.json.
      # Fail-closed: the build gate verifies HEAD == baseline before any build.
      - name: Checkout pinned vcpkg source
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: b8dfe957ec8b5c0ef5c4b31eea594b8486af744f
          path: .vcpkg-prototype
          fetch-depth: 0
          persist-credentials: false

      - name: Bootstrap pinned vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = $env:IRIS_PROTOTYPE_VCPKG_ROOT
          if ([string]::IsNullOrWhiteSpace($root)) { throw "IRIS_PROTOTYPE_VCPKG_ROOT is not set" }
          if (!(Test-Path -LiteralPath $root -PathType Container)) { throw "pinned vcpkg checkout missing: $root" }
          $bootstrap = Join-Path $root "bootstrap-vcpkg.bat"
          if (!(Test-Path -LiteralPath $bootstrap -PathType Leaf)) { throw "bootstrap-vcpkg.bat missing: $bootstrap" }
          & $bootstrap
          if ($LASTEXITCODE -ne 0) { throw "pinned vcpkg bootstrap failed: $LASTEXITCODE" }
          $exe = Join-Path $root "vcpkg.exe"
          if (!(Test-Path -LiteralPath $exe -PathType Leaf)) { throw "vcpkg.exe missing after bootstrap: $exe" }
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "vcpkg --version failed" }

      # MSVC developer environment (x64) so cl.exe/dumpbin are on PATH.
      - name: Set up MSVC developer environment (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # The MSVC action exposes Visual Studio's bundled vcpkg by setting
      # VCPKG_ROOT. Restore the separately pinned checkout for all subsequent
      # assertion, vcpkg-rs, and native-build steps.
      - name: Restore isolated vcpkg root after MSVC setup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = $env:IRIS_PROTOTYPE_VCPKG_ROOT
          if ([string]::IsNullOrWhiteSpace($root)) { throw "IRIS_PROTOTYPE_VCPKG_ROOT is not set" }
          if (!(Test-Path -LiteralPath $root -PathType Container)) { throw "pinned vcpkg checkout missing: $root" }
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-ffmpeg-prototype-cargo

      - name: Assert pinned Windows Server 2022 toolchain
        shell: pwsh
        run: ./prototype/windows-ffmpeg/assert-windows-toolchain-prototype.ps1

      - name: Pinned FFmpeg source and toolchain gate
        shell: pwsh
        run: ./prototype/windows-ffmpeg/build-windows-ffmpeg-prototype.ps1

      - name: Stage pinned Windows PDFium runtime
        shell: pwsh
        run: ./prototype/windows-ffmpeg/stage-windows-pdfium-prototype.ps1

      - name: Stage test-only prototype app
        shell: pwsh
        run: ./prototype/windows-ffmpeg/stage-windows-prototype-app.ps1

      - name: Inventory PE imports
        shell: pwsh
        run: ./prototype/windows-ffmpeg/inventory-windows-imports.ps1

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install innosetup --version=6.7.1 --allow-downgrade --yes --no-progress
          if ($LASTEXITCODE -notin @(0, 3010)) { throw "Inno Setup installation failed: $LASTEXITCODE" }
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6/ISCC.exe"
          if (!(Test-Path -LiteralPath $iscc -PathType Leaf)) { throw "ISCC.exe missing after install: $iscc" }
          & $iscc /? 2>&1 | Select-Object -First 3
          exit 0

      - name: Clean-installed preview smoke (video, PDF, RAW)
        shell: pwsh
        run: ./prototype/windows-ffmpeg/smoke-windows-installed-previews.ps1

      # Retain one bounded, path-sanitized report only. Never upload source
      # bundles, packages, AppDirs, installers, or native runtime libraries.
      - name: Prepare bounded prototype audit report
        if: always()
        shell: pwsh
        env:
          IRIS_PROTOTYPE_AUDIT_REPORT_MAX_BYTES: "262144"
        run: python ./prototype/windows-ffmpeg/create-prototype-audit-report.py

      - name: Upload bounded prototype audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-prototype-audit-report
          path: target/prototype-audit-report.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
