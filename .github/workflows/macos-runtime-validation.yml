name: macOS runtime validation

# Report-only inventory of the Homebrew baseline and pinned product runtime,
# plus a separate comparison; not legal approval, runtime parity or notarization.
# Called only by manual CI at its exact source ref; never dispatch Release.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-latest
    env:
      CARGO_TERM_COLOR: always
      IRIS_BUILD_VARIANT: product
      IRIS_MACOS_SIGN_IDENTITY: '-'
      IRIS_MACOS_NOTARY_PROFILE: ''
      IRIS_MACOS_DEPLOYMENT_TARGET: "14.0"
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      IRIS_RELEASE_AUDIT_MAX_REPORT_BYTES: ${{ vars.IRIS_RELEASE_AUDIT_MAX_REPORT_BYTES || 2097152 }}
      IRIS_RELEASE_AUDIT_MAX_COMMAND_BYTES: ${{ vars.IRIS_RELEASE_AUDIT_MAX_COMMAND_BYTES || 32768 }}
      IRIS_RELEASE_AUDIT_MAX_METADATA_BYTES: ${{ vars.IRIS_RELEASE_AUDIT_MAX_METADATA_BYTES || 8388608 }}
      IRIS_RELEASE_AUDIT_MAX_CARGO_PACKAGES: ${{ vars.IRIS_RELEASE_AUDIT_MAX_CARGO_PACKAGES || 1024 }}
      IRIS_RELEASE_AUDIT_MAX_NATIVE_FILES: ${{ vars.IRIS_RELEASE_AUDIT_MAX_NATIVE_FILES || 256 }}
      IRIS_RELEASE_AUDIT_COMMAND_SECONDS: ${{ vars.IRIS_RELEASE_AUDIT_COMMAND_SECONDS || 30 }}
      # Shared corpus is fetched once by the driver; only JSON leaves the job.
      IRIS_PREVIEW_CORPUS_MAX_BYTES: ${{ vars.IRIS_PREVIEW_CORPUS_MAX_BYTES || 40000000 }}
      IRIS_PREVIEW_CORPUS_TIMEOUT_SECONDS: ${{ vars.IRIS_PREVIEW_CORPUS_TIMEOUT_SECONDS || 60 }}
      IRIS_PREVIEW_LATENCY_WARMUPS: ${{ vars.IRIS_PREVIEW_LATENCY_WARMUPS || 2 }}
      IRIS_PREVIEW_LATENCY_SAMPLES: ${{ vars.IRIS_PREVIEW_LATENCY_SAMPLES || 21 }}
      IRIS_FFMPEG_JOBS: ${{ vars.IRIS_FFMPEG_JOBS || 2 }}
      IRIS_FFMPEG_BUILD_SECONDS: ${{ vars.IRIS_FFMPEG_BUILD_SECONDS || 3600 }}
      IRIS_FFMPEG_FETCH_SECONDS: ${{ vars.IRIS_FFMPEG_FETCH_SECONDS || 300 }}
      IRIS_FFMPEG_COMMAND_SECONDS: ${{ vars.IRIS_FFMPEG_COMMAND_SECONDS || 60 }}
      IRIS_FFMPEG_COMMAND_BYTES: ${{ vars.IRIS_FFMPEG_COMMAND_BYTES || 32768 }}
      IRIS_FFMPEG_MAX_NATIVE_FILES: ${{ vars.IRIS_FFMPEG_MAX_NATIVE_FILES || 256 }}
      IRIS_FFMPEG_MAX_REPORT_BYTES: ${{ vars.IRIS_FFMPEG_MAX_REPORT_BYTES || 266240 }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - name: Fetch locked Rust inputs
        run: cargo fetch --locked
      - name: Install comparison runtime and candidate build tools
        run: brew install ffmpeg pkg-config gnupg nasm cmake
      - name: Check candidate contracts
        id: candidate_contracts
        run: python3 scripts/test-macos-ffmpeg.py
      - name: Audit report-only Homebrew baseline
        shell: bash
        run: |
          # Historical Homebrew comparison only; never the production selector.
          # Only JSON is retained, not the temporary app/ZIP/PKG.
          trap 'rm -rf dist/macos target/package-macos' EXIT
          IRIS_MACOS_REPORT_ONLY=1 IRIS_MACOS_FFMPEG_BASELINE=1 ./scripts/package-macos-app.sh
          python3 scripts/release-audit.py macos --output audit/macos.json
      - name: Audit pinned production package
        shell: bash
        run: |
          # Exercise the same default-product runtime/staging/sign/archive path
          # without credentials or publication. Retain only bounded JSON evidence.
          trap 'rm -rf dist/macos target/package-macos' EXIT
          ./scripts/package-macos-app.sh
          python3 scripts/macos-ffmpeg.py check dist/macos/Iris.app
          python3 scripts/release-audit.py macos --output audit/macos-product.json
      - name: Validate pinned candidate
        # Run after a baseline failure when candidate prerequisites passed;
        # never continue after cancellation or a failed candidate-contract step.
        if: ${{ !cancelled() && steps.candidate_contracts.outcome == 'success' }}
        shell: bash
        run: |
          # Pinned shared-library candidate bound to its fresh prefix. Cargo is
          # pointed at that prefix and never at Homebrew FFmpeg. The driver owns
          # unique native/Cargo/corpus scratch and removes it on success/failure.
          # Separate fresh default-feature targets measure Homebrew and the staged
          # candidate against the same verified corpus. No caches or Release calls.
          trap 'rm -rf dist/macos target/macos-runtime-validation' EXIT
          python3 scripts/macos-ffmpeg.py validate audit/macos-candidate.json
      - name: Clean temporary bytes even after interruption
        if: always()
        run: rm -rf dist/macos target/package-macos target/macos-runtime-validation
      - name: Retain JSON evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-runtime-audit
          if-no-files-found: error
          path: |
            audit/macos.json
            audit/macos-product.json
            audit/macos-candidate.json
